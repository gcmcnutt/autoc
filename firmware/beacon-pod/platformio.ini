; Beacon emitter — PlatformIO project (xiao-style; open this dir as an additional VS Code workspace folder so the
; PlatformIO toolbar gives Build / Upload / Monitor). One bare-C source tree builds for BOTH the ATtiny416
; Xplained Nano (eval) and the ATtiny412 (production target). No Arduino framework (emitter-toolchain-plan.md §3)
; — atmelmegaavr provides the toolchain + device pack (no apt/avr-libc, no sudo).
;
; DEBUG: PlatformIO has NO hardware debugger for tinyAVR (DebugSupportError for ATtiny416). Real UPDI debug
; (breakpoints/step/watch) = MPLAB X on Windows driving the on-board mEDBG. Here, the serial monitor (UART printf
; over the mEDBG CDC) is the practical debug channel.

[env]
platform = atmelmegaavr

[env:xnano416]                       ; eval board — flashed through the on-board mEDBG via pymcuprog
board = ATtiny416
board_build.f_cpu = 10000000L        ; firmware sets prescaler /2 at boot -> 10 MHz core (in-spec 2.7-5.5 V; A2-pwr)
upload_protocol = custom
; chip-erase then write. (No --verify: pymcuprog's post-write verify reads back 0x00 spuriously on this mEDBG/416
;  even though the write is correct — confirmed by reading flash back. erase+write is the reliable recipe.)
upload_command = /home/gmcnutt/.venvs/avr/bin/pymcuprog erase -d attiny416 && /home/gmcnutt/.venvs/avr/bin/pymcuprog write -d attiny416 -f $SOURCE
monitor_speed = 115200               ; target USART0 <-> mEDBG CDC (for firmware printf once the UART is added)
monitor_port = /dev/ttyACM0          ; the attached mEDBG CDC (adjust if it enumerates elsewhere)

[env:pod412]                         ; production target — serialUPDI (USB-UART + 4.7k)
board = ATtiny412
board_build.f_cpu = 10000000L        ; shared main.c sets prescaler /2 -> 10 MHz (in-spec on raw 1S; A2-pwr)
upload_protocol = serialupdi
upload_port = /dev/ttyUSB0
upload_speed = 230400
monitor_speed = 115200
