; Beacon emitter — PlatformIO project (xiao-style; open this dir as an additional VS Code workspace folder).
; One bare-C source tree builds for BOTH the ATtiny416 Xplained Nano (eval) and the ATtiny412 (target).
; No Arduino framework (per emitter-toolchain-plan.md §3) — atmelmegaavr provides toolchain + device pack.
[env]
platform = atmelmegaavr

[env:xnano416]                       ; eval board — flashed through the on-board mEDBG via pymcuprog
board = ATtiny416
board_build.f_cpu = 3333333L         ; default 20 MHz / 6 after reset
upload_protocol = custom
upload_command = /home/gmcnutt/.venvs/avr/bin/pymcuprog write -d attiny416 --erase --verify -f $SOURCE

[env:pod412]                         ; production target — serialUPDI (USB-UART + 4.7k)
board = ATtiny412
board_build.f_cpu = 20000000L
upload_protocol = serialupdi
upload_port = /dev/ttyUSB0
upload_speed = 230400
