[project]
name = "beacon-telemetry"
version = "0.0.1"
description = "Host-side reader/logger for the StepFPGA beacon-correlator UART telemetry (031 acquisition)"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
beacon-telemetry = "beacon_telemetry.reader:main"

[tool.setuptools]
packages = ["beacon_telemetry"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
