; beacon-640x200.ini — the half-height sensor mode, which is what makes full-field work affordable.
;
; Differs from beacon-bench.ini in ONE key: [camera] mode. Everything else is the bench config.
;
; WHY IT EXISTS (event-camera-emulation.md §2, MEASURED 2026-08-27): the dmabuf is write-combine and the
; read is a hard 80 MB/s bandwidth wall that four threads do not improve. At 640x400 that read is 3.21 ms
; against a 3.33 ms frame period — 96 %, leaving nothing for anything else. At 640x200 it is 1.29 ms
; (39 %), streaming cleanly at 0 seq gaps.
;
; It is a CROP, not a bin, so horizontal scale is unchanged and the FINE scale survives — the objection
; that killed the 320x200 proposal does not apply here. The cost is half the vertical field (~147 x 45
; instead of 147 x 90), which is a judgement about the engagement, not something the bench can settle.
;
; NB 320x200 (beacon-lowres.ini) does NOT stream through this PiSP/CFE path — see that file.

[camera]
mode = 640x200
; PER-HOST fps notes (same 0.96-ish delivery factor on both, different cliffs):
;   3A+ / vc4:  request 288 -> 276.5 delivered; >300 requested wedges the pipeline
;   Pi 5 / pisp: request 300 -> 288.5 delivered; >=305 requested WEDGES THE SENSOR (FrameDurationLimits
;                below ~3.3 ms kills it after one frame despite the mode advertising 3228 us — the
;                309.79 fps top and beyond belong to the §12 driver-timing work)
fps = 300
; DAYLIGHT-capable floor (measured 2026-08-20 on the Pi 5/pisp): beacon contrast at the bench is
; exposure-inverse — 200 us gives 1.24x over daytime background, 30 us gives 2.06x. Boot at the floor;
; the ROI-driven AGC walks exposure up when the scene darkens (evening bench was happy at 200 us).
exposure_min_us = 60
exposure_max_us = 3000
gain_min_q8 = 512          ; 2.0
gain_max_q8 = 4096         ; 16.0

[code]
n_chips = 31
; T083 — MEASURE the emitter period instead of believing chip_hz_nominal forever. 1 = on.
; The receiver clock is GLOBAL (one emitter, one clock), so this lives in the engine, not per-track.
; Discriminator: the tracked chip_phase, unwrapped, is a clean linear ramp whose slope IS the frequency
; error — measured at 0.718-0.792 chip/s on three clips across two days, residual 0.27-0.36 chip.
; Deliberately SLOW: 5 s accumulation, 0.02 Hz deadband, 0.25 Hz slew cap. The two 2026-08-19 attempts
; ran per-tick off that same statistic and diverged (115->109 Hz, then 112..129 Hz); over 5 s the drift
; is 3.6 chips against 0.3 chip of noise, so a windowed estimate has the SNR a per-tick one lacks.
rate_track = 1
; DESIGN POINT (operator 2026-08-20): the platform sits on 288 fps / 2.4 samples-per-chip, so the chip rate
; is 288 / 2.4 = 120.0 Hz exactly. The emitter's 'H' bench mode: TCA_TOP_BENCH = 5208 -> 120.0077 Hz nominal.
; Sampling is then a deterministic 12-frames-per-5-chips pattern rather than a drifting one.
; MEASURED 2026-08-30, two independent ways agreeing to 0.002 Hz: raw-pixel Gold sweep on static_ir gave
; 120.794 Hz, and the unwrapped phase-drift slope gave 120.718 / 120.743 / 120.792 across three clips on
; two days. The pod is ~6200 ppm ABOVE the 120.0 this used to say -- and it did NOT present as "no lock"
; the way the note below promises, because a 258 ms window accrues only 0.20 chip of drift. It presented
; as 99%% LOCK at q 1.00: the derated lock that note warns about, exactly.
; Neutral at the current K=31 window (pend3: 3428 fixes at 120.0 vs 3436 at 120.85) but it matters for
; LONG windows, which is what range needs: at K=124 the wrong rate costs LOCK 82%% -> 75%%.
; This is an interim constant. T083 (track the period) is the real answer -- see
; results/stage1-chip-rate-and-q.md.
chip_hz_nominal = 120.75
; NO RATE SEARCH (operator 2026-08-20): the whole toolchain — pod firmware, decoder gateware and this
; receiver — is pinned to the one constant above, and acquire_next_rate_q8() now returns chip_hz_nominal
; UNCONDITIONALLY. This list is therefore inert: adding entries here CANNOT reintroduce a scan, by design,
; so that no stale config can quietly put the rig back on a different operating point.
; Deliberate consequence: a pod that is not at 120 Hz presents as NO LOCK — go look at the pod rather than
; chase a derated lock that measures the wrong thing. Measured after the 2026-08-20 reflash: 119.940 Hz.
chip_hz_candidates = 120.75
code_a = 0000000100011011000011001110011
code_b = 0100011001100111100101001011110

[bank]
max_slots = 16
; APERTURE EXTENTS, in PLANE px per side at each scale (coarse -> fine). The plane pixel is 4 / 2 / 1
; native px, so the ANGULAR coverage is E*f native px per side: 96 / 32 / 10 here.
;
; THE RULE THAT MATTERS (measured 2026-08-29, static_ir.bcnr + pend_ir.bcnr): the aperture half-width
; must comfortably exceed the alpha-beta loop's own positional wander, or the loop cannot stay inside its
; own net. The old 24,12,6 broke that at FINE: extent 6 at f=1 is a 6x6 NATIVE = 3x3 M2 px aperture,
; half-width 1.5 M2 px, against innovations that routinely run 1-2 M2 px. The track walked out of its own
; aperture roughly every 2 s, on a STATIC beacon, while the code was still perfectly visible -- dying at
; q = 1.00 because the position measurement (not the correlation) had failed.
;
; MEASURED, static beacon centred, 30 s:        MEASURED, pend_ir (moving), 240 s:
;   24,12,6   LOCK 88%  measured 62%  9 dropouts    1770 on-beacon fixes, 18 false (1.0%)
;   24,12,10  LOCK 98%  measured 80%  1 dropout     2220 fixes (+25%), 8 false (0.4%)
;   24,16,10  LOCK 98%  measured 80%  1 dropout     2306 fixes (+30%), 2 false (0.1%)
;
; Biggest gains are mid-rate, where the beacon IS decodable: 3-5 deg/s 56% -> 76%, 5-8 deg/s 36% -> 55%.
; Cost is negligible and ROI-proportional: a MEDIUM aperture goes 576 -> 1024 native px per slot per
; frame against a 256000 px frame, and the steady state is two slots (precision + its guard).
scale_extents = 24,16,10
alpha = 0.35
beta = 0.08
q_lock = 0.55
q_drop = 0.30
; q_fix — the quality a measurement must reach to COUNT AS A FIX (BCN_F_MEASURED_FIX + last_fix_us).
; NOT the same question as q_lock: q_lock asks "does this track deserve to be CONFIRMED", q_fix asks
; "is this tick's position worth believing". MEASURED on pend_ir against fiducial truth (2026-08-29,
; with the 64-bit correlator): on-beacon fixes q p05 0.86 / p50 1.00, off-target fixes p50 0.45 / p95
; 0.67. At 0.75 that keeps 98%% of real fixes and removes 100%% of the off-target ones.
q_fix = 0.75
lock_health_lock = 0.60
lock_health_drop = 0.35
; T085: promotion floor on modulation depth (aperture energy / DC level). A constant lamp
; carries no code but still scores a respectable q, because q is |corr|/energy and both
; collapse together on a flat source. MEASURED across every fixture: lamp p95 0.88 / max 2.04,
; beacon median 1.9 (lit60, worst) to 22.6 (pend1m). 0 disables.
; DEFAULT 0 = OFF: the candidate value is 1.0 but the end-to-end A/B has NOT been run,
; and the beacon's own low tail (lit60 p05 0.06, pan2 p05 0.52) sits BELOW the lamp's
; p95 of 0.88 -- so a threshold that kills the lamp will also refuse some genuine
; promotions on the worst clips. Do not enable until that trade is measured.
min_mod_depth = 0.0
; THESE TWO ARE THE spec §3.1 VALIDITY BOUNDS — the HOLD state machine and the envelope scorer read the
; same numbers from here, by design, so they cannot drift apart.
hold_max_age_ms = 150
hold_max_cep_px = 3.0

[agc]
exposure_target_lo = 40
exposure_target_hi = 200
integration_min_chips = 31
integration_max_chips = 124
roi_driven = 1

[record]
mode = burst
path = /dev/shm/clip.bcnr
; ring: 512 MB host — 1 s @ 288 fps @ 640x400 = 74 MB, leaves room for the tracker
ring_seconds = 1
; 80 frames = one full word (74.4 = 31 chips x 2.4 samples at 288 fps / 120 Hz) with margin; every burst
; is replayable
burst_frames = 80
burst_every = 500
trigger = manual

[sched]
acquire_cost_us_per_pass = 12000
acquire_passes_max = 2

[sync]
fiducial_enabled = 0
fiducial_period_s = 10
msp_uart = /dev/ttyAMA0
msp_baud = 115200
