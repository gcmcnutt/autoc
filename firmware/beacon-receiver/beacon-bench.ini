; beacon-bench.ini — the 042 bench rig (Pi 3A+ + OV9281 + code-B emitter in 'H' mode).
; Constitution VII: EVERY key below is required; there are no in-code defaults. A missing key names
; itself and exits 1. Values are the MEASURED bench numbers of 2026-08-19, not aspirations.

[camera]
mode = 640x400
; request 288 -> the pipeline delivers 276.5 (delivered = 0.9595 x requested, measured across the ladder;
; >300 requested wedges the pipeline)
fps = 288
exposure_min_us = 200      ; the proven bench operating point at ~2 m (with gain 4)
exposure_max_us = 3000
gain_min_q8 = 1024         ; 4.0 — bench operating point
gain_max_q8 = 4096         ; 16.0

[code]
n_chips = 31
; the emitter's 'H' bench mode: TCA_TOP_HALF -> 114.995 Hz nominal; camera measured 115.79 (RC osc +0.7%)
chip_hz_nominal = 115.0
; multi-rate acquire candidates (031 trap: 'H' is volatile — a reset returns the emitter to 200 Hz, so
; 200/210 stay in the list; 121 was the old measured-'H' value, kept for drift)
chip_hz_candidates = 110.0,115.0,121.0,200.0,210.0
code_a = 0000000100011011000011001110011
code_b = 0100011001100111100101001011110

[bank]
max_slots = 16
scale_extents = 24,12,6
alpha = 0.35
beta = 0.08
q_lock = 0.55
q_drop = 0.30
lock_health_lock = 0.60
lock_health_drop = 0.35
; THESE TWO ARE THE spec §3.1 VALIDITY BOUNDS — the HOLD state machine and the envelope scorer read the
; same numbers from here, by design, so they cannot drift apart.
hold_max_age_ms = 150
hold_max_cep_px = 3.0

[agc]
exposure_target_lo = 40
exposure_target_hi = 200
integration_min_chips = 31
integration_max_chips = 124
roi_driven = 1

[record]
mode = burst
path = /dev/shm/clip.bcnr
; ring: 512 MB host — 1 s @ 276 fps @ 640x400 = 71 MB, leaves room for the tracker
ring_seconds = 1
; 80 frames = one full word (74 at 276.47 fps / 115.79 Hz) with margin; every burst is replayable
burst_frames = 80
burst_every = 500
trigger = manual

[sched]
acquire_cost_us_per_pass = 12000
acquire_passes_max = 2

[sync]
fiducial_enabled = 0
fiducial_period_s = 10
msp_uart = /dev/ttyAMA0
msp_baud = 115200
