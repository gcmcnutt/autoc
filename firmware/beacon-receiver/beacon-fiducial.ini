; beacon-fiducial.ini — the bench rig during a GROUND-TRUTH pass (printed ArUco targets in frame).
;
; IDENTICAL to beacon-bench.ini except for ONE line: exposure_min_us is pinned at 1500 instead of 60.
;
; WHY. The ROI-driven AGC (agc.c) drives exposure DOWN to keep the beacon's peak inside
; [exposure_target_lo, exposure_target_hi] = 40..200, and on this rig it settles at ~53 us. At 53 us a
; printed sheet under room light is BLACK — measured 2026-08-21 — so a fiducial pass with the bench ini
; would record perfect beacon data and no visible targets at all. The AGC can only move within
; [exposure_min_us, exposure_max_us], so raising the FLOOR pins it: the AGC still works, it just cannot
; walk down out of the range where paper is visible.
;
; VERIFIED ON THE RIG 2026-08-21 (15 s clip, /data/fid_test.bcnr) -- both halves work at once:
;   beacon  : track present 81 %, q mean 0.88, chip_hz 120.00/120.00, cep 0.29
;   markers : >=3 ArUco on 100 % of frames (full 2D pose EVERY frame), all four on 97 %
;   recorder: 4320/4320 frames, 0 dropped, 0/300 deadline misses
; I predicted the beacon would SATURATE here and it does not -- the BCN_F_SATURATED flag was set on
; 0 of 243 fixes. So §5's flat-top estimator never even engages at this exposure; the beacon is simply
; brighter-but-linear. Recorded because the opposite assumption would have been an argument for a lower
; floor than is actually needed.
;
; Frame period at 288 fps is 3474 us, so 3000 (exposure_max_us) is the hard ceiling regardless.
;
; DO NOT use this for envelope runs — the operating point is not the flight one. It exists so an offline
; replay can recover camera pose from the printed targets while the tracker runs at a degraded exposure.
; Constitution VII: EVERY key below is required; there are no in-code defaults. A missing key names
; itself and exits 1. Values are the MEASURED bench numbers of 2026-08-19, not aspirations.

[camera]
mode = 640x400
; PER-HOST fps notes (same 0.96-ish delivery factor on both, different cliffs):
;   3A+ / vc4:  request 288 -> 276.5 delivered; >300 requested wedges the pipeline
;   Pi 5 / pisp: request 300 -> 288.5 delivered; >=305 requested WEDGES THE SENSOR (FrameDurationLimits
;                below ~3.3 ms kills it after one frame despite the mode advertising 3228 us — the
;                309.79 fps top and beyond belong to the §12 driver-timing work)
fps = 300
; DAYLIGHT-capable floor (measured 2026-08-20 on the Pi 5/pisp): beacon contrast at the bench is
; exposure-inverse — 200 us gives 1.24x over daytime background, 30 us gives 2.06x. Boot at the floor;
; the ROI-driven AGC walks exposure up when the scene darkens (evening bench was happy at 200 us).
exposure_min_us = 1500       ; FIDUCIAL PASS: pinned high so paper is visible (see below)
exposure_max_us = 3000
gain_min_q8 = 512          ; 2.0
gain_max_q8 = 4096         ; 16.0

[code]
n_chips = 31
; DESIGN POINT (operator 2026-08-20): the platform sits on 288 fps / 2.4 samples-per-chip, so the chip rate
; is 288 / 2.4 = 120.0 Hz exactly. The emitter's 'H' bench mode: TCA_TOP_BENCH = 5208 -> 120.0077 Hz nominal.
; Sampling is then a deterministic 12-frames-per-5-chips pattern rather than a drifting one.
chip_hz_nominal = 120.0
; NO RATE SEARCH (operator 2026-08-20): the whole toolchain — pod firmware, decoder gateware and this
; receiver — is pinned to the one constant above, and acquire_next_rate_q8() now returns chip_hz_nominal
; UNCONDITIONALLY. This list is therefore inert: adding entries here CANNOT reintroduce a scan, by design,
; so that no stale config can quietly put the rig back on a different operating point.
; Deliberate consequence: a pod that is not at 120 Hz presents as NO LOCK — go look at the pod rather than
; chase a derated lock that measures the wrong thing. Measured after the 2026-08-20 reflash: 119.940 Hz.
chip_hz_candidates = 120.0
code_a = 0000000100011011000011001110011
code_b = 0100011001100111100101001011110

[bank]
max_slots = 16
scale_extents = 24,12,6
alpha = 0.35
beta = 0.08
q_lock = 0.55
q_drop = 0.30
lock_health_lock = 0.60
lock_health_drop = 0.35
; THESE TWO ARE THE spec §3.1 VALIDITY BOUNDS — the HOLD state machine and the envelope scorer read the
; same numbers from here, by design, so they cannot drift apart.
hold_max_age_ms = 150
hold_max_cep_px = 3.0

[agc]
exposure_target_lo = 40
exposure_target_hi = 200
integration_min_chips = 31
integration_max_chips = 124
roi_driven = 1

[record]
mode = burst
path = /dev/shm/clip.bcnr
; ring: 512 MB host — 1 s @ 288 fps @ 640x400 = 74 MB, leaves room for the tracker
ring_seconds = 1
; 80 frames = one full word (74.4 = 31 chips x 2.4 samples at 288 fps / 120 Hz) with margin; every burst
; is replayable
burst_frames = 80
burst_every = 500
trigger = manual

[sched]
acquire_cost_us_per_pass = 12000
acquire_passes_max = 2

[sync]
fiducial_enabled = 0
fiducial_period_s = 10
msp_uart = /dev/ttyAMA0
msp_baud = 115200
