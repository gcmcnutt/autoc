# autoc-tracker.ini — NN neuroevolution configuration, TRACKER MODE
# 030 v1: trains a chase-craft NN to track a recorded source-run target
# trajectory via simulated wingtip-beacon camera. See spec.md / plan.md /
# data-model.md in specs/030-tracker-mode/.
#
# Structured to mirror autoc.ini section-by-section for side-by-side diff.
# Production config (2026-05-08, post-M11.preA): pop 5000, gens 800, all
# 294 source scenarios (6 paths × 49 winds), 20 threads, time-based seed,
# CRRCSim FDM-driven (the M2 chase craft is full FDM hb1, NOT kinematic;
# crrcsim is the sole worker as of 034). Entry + Wind variations enabled (live
# under FDM); RabbitSpeedVariations is OFF for log honesty since tracker
# has no synthetic rabbit (the master switch is cosmetic-only — has no
# M2 effect either way; flipping it to match autoc.ini key-surface
# parity is fine but the 0 value reads more truthfully in logs).

# =============================================================================
# 030 TRACKER MODE — runtime mode dispatch (FR-019) + source dmp (FR-001)
# =============================================================================
# autoc-tracker.ini's defining property. ConfigManager loud-fails at startup
# if Mode is anything other than {pathgen, tracker}; tracker requires
# TrackerSourceRun (S3 key or local path).
Mode                            = tracker

# Source dmp — S3 key form "<run-id>/gen<N>.dmp" (resolved against S3Bucket
# below). 2026-06-03: the origm1-5000x49 run (run-id
# autoc-9223370256441628515-2026-06-02T15:12:27.292Z, master seed 1780413146,
# 6 paths × 49 winds = 294 scenarios). Converged pastonly3-class climber —
# stopped at gen 590 (sigma at floor, fitness −55269.63, streak 37.9,
# 294/294 complete). gen9410 = gen 590 (10000−590); nnextractor + eval
# cross-checked this dmp reproduces −55269.634183 bit-exact.
# 038 US3 M2 (2026-07-07): track the fresh ENRICHED M1 rebake t5
# (autoc-038-t5-m1-source-rebake — 37-input FR-P0H format, gen 800 elite best
# -41083.52, avgMaxStreak 61.5, pctInStreak 30.9%, 0 hull, 294/294 complete).
# Freshest enriched source; supersedes t3 (autoc-9223370253844606963-...2026-07-02...)
# which was the baseline-ablation source. The enriched (37-input) binary fail-loud
# rejects the older 33-input source dmps (topology mismatch, Constitution V).
# TrackerSourceBucket=autoc-m1 reads the source from the M1 bucket; M2 output still
# goes to S3Bucket=autoc-m2. gen9200 = gen 800 (10000−800).
TrackerSourceRun                = autoc-9223370253553029228-2026-07-06T01:35:46.579Z/gen9200.dmp.zst
TrackerSourceBucket             = autoc-m1

# Scenario subset — cross-product (FR-011). Empty = all (filterByScenarioIndex
# identity case at src/eval/source_dmp_loader.cc:184). Production scale
# (2026-05-07): all 6 paths × all 49 winds = 294 scenarios. Earlier smoke
# used `= 0` for single scenario eyeballing.
TrackerPathSubset               =
TrackerWindSubset               =

# =============================================================================
# EVOLUTION PARAMETERS
# =============================================================================
# Production scale (2026-05-07) matching autoc.ini's M1 config so tracker
# vs pathgen training are size-comparable. Earlier smoke used pop=32
# gens=2 for "does it launch" eyeballing.
PopulationSize                  = 5000      # 2026-06-03 — match current autoc.ini (origm1 5000)
NumberOfGenerations             = 800       # matches autoc.ini m1
CrossoverProbability            = 95
CreationProbability             = 5
TournamentSize                  = 5
SwapMutationProbability         = 15
AddBestToNewPopulation          = 1

# NN-specific
NNMutationSigma                 = 0.2       # initial mutation sigma
NNSigmaFloor                    = 0.05      # minimum sigma (0 = disabled)
NNCrossoverAlpha                = -1        # uniform random per weight
# NNInitMethod: "xavier" or "uniform" (NOTE: currently unwired — NN init is hardcoded)
NNInitMethod                    = xavier

# Selection strategy (015): "sum" (legacy), "minimax", "lexicase"
SelectionMode                   = lexicase
LexicaseEpsilonMode             = mad        # 035 FR-003 — per-axis MAD-relative epsilon (energy bake)

# =============================================================================
# SIMULATION
# =============================================================================
ControlIntervalMsec             = 50       # t10: 20 Hz (must == SIM_TIME_STEP_MSEC; close-in bandwidth + 0.8s history — finding.md)
ServoModelEnabled               = 1         # 037 servo v2 (PWM latch + slew): 50Hz latch w/ 0-20ms phase + slew ~24.2/s (autoc [-1,1] units)
SimNumPathsPerGeneration        = 6         # matches autoc.ini m1
EvalThreads                     = 20        # matches autoc.ini m1

# Path generation: tracker mode ignores generated paths (the chase craft
# tracks the source trajectory, not a path). Field is kept for ScenarioStepper
# scaffolding compat — pathgen-mode uses it normally.
PathGeneratorMethod             = aeroStandard

# Seeded random path generation (unused in tracker mode; preserved for
# regression compat with autoc.ini key surface).
RandomPathSeedB                 = 13337

# RNG seed (-1 for time-based; run 3x to distinguish pattern from fluke)
Seed                            = -1        # matches autoc.ini m1

# Worker: CRRCSim FDM-driven (sole worker path as of 034 — minisim retired).
# The tracker side runs in crrcsim's mod_inputdev via CrrcsimTrackerHelper.
# FDM chase craft = real hb1 physics (not kinematic); wind + aero + entry
# (+ 034 craft) variations all live.
WorkerPortOverride             = 0
WorkerProgram                  = ./scripts/crrcsim.sh

# =============================================================================
# SCENARIO VARIATIONS
# =============================================================================
# M11.preA / 2026-05-08: with crrcsim FDM tracker, Entry + Wind variations
# are LIVE — they perturb chase craft init pose + wind field per scenario,
# producing the same per-scenario diversity that autoc.ini's pathgen
# training has. Source-scenario joint-PRNG variation params from the
# source recording (FR-001 + FR-010) still apply to the source side.
# RabbitSpeedVariations is OFF for log honesty (tracker has no synthetic
# rabbit; the master switch is cosmetic-only and has no M2 effect either
# way — verified at src/autoc.cc:229 the rabbitSpeedSeed PRNG draw is
# unconditional, so the master switch doesn't even shift PRNG state).
WindScenarios                   = 49        # 2026-06-03 match autoc.ini + the new source (origm1 recorded at 6 paths × 49 winds = 294 scenarios). Empty TrackerWindSubset = track all.

EnableEntryVariations           = 1         # active under crrcsim FDM
EnableWindVariations            = 1         # active under crrcsim FDM (wind seed → gusts/thermals)
EnableRabbitSpeedVariations     = 0         # tracker has no synthetic rabbit; log-honest (cosmetic only — switch has no M2 effect either way)
EnableCraftVariations           = 1         # 034 US4 — see [Craft] section below for σ knobs
EnableHullCrashPenalty          = 1         # 038 T001 — score ×factor^(#hull-strike scenarios); M2 safety. t12 ON, t11 was OFF
# 038 US3 — add span/closure prediction_score lexicase axis. Aux outputs[3..6]
# are the predicted span @ +50/+100/+150ms + closure-rate; the head is always in
# the topology, this only gates the selection axis.
EnablePredictorHead             = 1
# 038 t7 — chase shares the M1 source's per-scenario airspace/airframe: derive
# the chase's wind/thermal/gust/entry/craft/crash-hull seeds from the SOURCE's
# recorded scenarioSeed (both craft fly the same realized env), NOT a fresh M2
# draw. NN mutation + future camera stay on the M2 seed. Requires full path×wind
# (empty subsets). 1 = t7 shared-airspace A/B; 0 = t6 independent draws.
TrackerChaseUseSourceScenarioSeed = 1

EntryConeSigma                  = 18        # 037 T006: 2.5-sigma clamp -> 45 deg max half-angle (was 30)
EntryRollSigma                  = 30        # roll around body axis
EntrySpeedSigma                 = 0.06      # 037 T006: 2.5-sigma clamp -> 15% max speed delta (was 0.1)
WindDirectionSigma              = 45

EntryPositionRadiusSigma        = 0.0
EntryPositionAltSigma           = 0.0

# =============================================================================
# 034 US4 — CRAFT VARIATIONS (per-scenario airframe parameter draws)
# =============================================================================
# See autoc.ini for full doc. M2 tracker bakes carry the same craft σ knobs
# as M1; chase craft uses the same FDM, so same diversity space. Defaults
# match autoc.ini so M1 source library and M2 tracker training see the
# same airframe distribution. EnableCraftVariations is in the enable
# group above (alongside Entry/Wind/RabbitSpeed).
CraftCGSigma                    = 0.02
CraftDragSigma                  = 0.05
CraftTrimSigma                  = 0.02
CraftThrustSigma                = 0.05
CraftPitchEffSigma              = 0.05
CraftRollEffSigma               = 0.05
# 037 actuator-dynamics axes (absolute physical, in-FDM servo/thrust lag).
# Sigma in intrinsic units; center+clamp live in craft_variation.h.
CraftServoSlewSigma             = 4.0       # /s, autoc [-1,1] units (2026-06-12 unit fix: center ~24.2 = 82.5ms span transit, clamp 16-32; sigma doubled with the units)
CraftThrustTauSigma             = 0.060

# Variation landscape ramp (0 = disabled ⇒ computeVariationScale pins 1.0).
# 038 t8: ramp OFF — full-magnitude variations from gen 1. With
# TrackerChaseUseSourceScenarioSeed=1 this makes the chase's realized env
# IDENTICAL to the source's (which was recorded at scale ≈1.0): t7 shared the
# seed but its ramp scaled the applied env down early, so the air mass only
# truly matched late in the run. Cost: no easy-early curriculum (t7 was 40).
VariationRampStep               = 0         # t8: full shared-source env from gen 1 (t7/m1 used 40)

# =============================================================================
# VARIABLE RABBIT SPEED
# =============================================================================
# Pathgen-only — tracker mode uses source-trajectory velocity, not a
# synthetic rabbit. Fields preserved for autoc.ini key-surface parity;
# values match autoc.ini m1 production but are ignored by tracker code.
RabbitSpeedNominal              = 12.0      # m/s — matches autoc.ini m1
RabbitSpeedSigma                = 2.0       # m/s — matches autoc.ini m1
RabbitSpeedMin                  = 9.0       # m/s — matches autoc.ini m1
RabbitSpeedMax                  = 18.0      # m/s — matches autoc.ini m1
RabbitSpeedCycleMin             = 3.0       # seconds — matches autoc.ini m1
RabbitSpeedCycleMax             = 7.0       # seconds — matches autoc.ini m1

# =============================================================================
# 030 TRACKER FITNESS — trail rabbit (FR-008 + FR-008a + R10)
# =============================================================================
# rabbit = target_pos - velocity_unit × TrailDistance
# Below LowSpeedTrailThreshold m/s, fall back to nose-trail (R10 hysteresis).
# v1 baselines per data-model.md §6. M7 implementation lands this loop;
# M6e uses zero-fitness placeholder so values don't matter for smoke.
TrailDistance                   = 3.048      # m (10 ft per FR-008)
LowSpeedTrailThreshold          = 2.0        # m/s
LowSpeedTrailHysteresis         = 0.5        # m/s ±band

# =============================================================================
# 030 TRACKER FITNESS — crash hull (FR-008b + R3)
# =============================================================================
# Sphere intersection at chase-vs-target distance < CrashHullRadius fires
# probabilistic crash with p_crash on curriculum schedule.
# v1 only CrashHullShape = SPHERE; M7 wires the actual check.
CrashHullShape                  = SPHERE
CrashHullRadius                 = 1.0        # m
CrashHullProbability            = 0.10       # 030 M11.preA.3 fixed Bernoulli per NN tick at 10 Hz. ~50% death within 7 ticks inside hull.

# =============================================================================
# 030 TRACKER ARENA (FR-016)
# =============================================================================
# Chase craft outside cylinder ⇒ scenario terminates with arena-egress
# penalty; HOME_X/Y/Z/DIST inputs (TrackerInput slots 44-47) populate
# from the cylinder origin at (0, 0, 0).
FlightArenaRadius               = 80.0       # m horizontal
FlightArenaFloorAGL             = 5.0        # m AGL hard floor
FlightArenaCeilingAGL           = 100.0      # m AGL ceiling

# =============================================================================
# 030 CAMERA (FR-003) — v1 baseline per spec D10
# =============================================================================
# Single forward-pointing camera, planar pinhole, top-of-wing-chord mount.
CameraCount                     = 1
CameraFOVHorizontalDeg          = 120.0
CameraFOVVerticalDeg            = 90.0
CameraFrameRateHz               = 30.0
CameraLatencyMs                 = 0.0        # v1: zero pipeline latency
CameraMountOffsetX              = 0.0        # body +x forward
CameraMountOffsetY              = 0.0
CameraMountOffsetZ              = -0.05      # m above wing surface (NED, +Z down)

# Airframe self-occlusion (D10) is controlled by the compile-time constant
# `kAirframeOcclusionEnabled` in include/autoc/eval/camera_projection.h —
# NOT a runtime .ini field. Currently false (transparent airframe);
# flip to true and recompile once real airframe geometry is calibrated.
# Per operator routing 2026-05-07: occlusion will be permanently ON once
# sim training shifts to real-flight prep, so a runtime knob would be
# lifecycle drag.

# =============================================================================
# 030 BEACONS (FR-004) — wingtip emitters
# =============================================================================
# 270° outward emission cone; distinct IR wavelengths.
BeaconLeftWavelengthNm          = 850
BeaconRightWavelengthNm         = 940
BeaconEmissionConeDeg           = 270.0
BeaconLeftMountX                = 0.0
BeaconLeftMountY                = -0.45      # left wingtip (body -y)
BeaconLeftMountZ                = 0.0
BeaconRightMountX               = 0.0
BeaconRightMountY               = +0.45      # right wingtip (body +y)
BeaconRightMountZ               = 0.0

# =============================================================================
# STORAGE
# =============================================================================
# 2026-06-04 — per-mode bucket contract (see specs/035 "S3 storage contract")
# is the PLAN: M2 train → autoc-storage-tracker. BLOCKED: the autoc-generator
# IAM user lacks s3:CreateBucket, so that bucket can't be made with current
# 035 T022 — per-mode bucket cutover: M2 tracker runs write here (lifecycle
# retain=expire is live). NOTE: source_dmp_loader reads TrackerSourceRun from
# THIS bucket too — the current source below lives in autoc-storage, so repoint
# TrackerSourceRun to a fresh energy-objective M1 run present in autoc-m2 before
# baking (there is no separate TrackerSourceBucket knob).
S3Bucket                        = autoc-m2
; S3Profile                     = minio

# =============================================================================
# EVALUATION MODE
# =============================================================================
# 0 = normal NN evolution, 1 = evaluate saved weight file
EvaluateMode                    = 0
; NNWeightFile                  = nn_weights.dat

# =============================================================================
# FITNESS: POINT-ACCUMULATION SCORING (022, conical surface V4)
# =============================================================================
# Pathgen cone-surface fitness; tracker mode reuses cone-surface against the
# trail rabbit (M7), so the fields below feed both modes once M7 lands.
FitDistScaleBehind              = 7.0       # distance scale behind rabbit (m)
FitDistScaleAhead               = 2.0       # distance scale ahead of rabbit (m, sharp)
FitConeAngleDeg                 = 45.0      # angular half-decay from tail-chase line (deg)
FitStreakThreshold              = 0.5       # 038 P0-F: reverted t15's 0.3 (reward-shaping exhausted as depth lever; t15 gain was threshold-confounded)
FitStreakRampSec                = 5.0       # seconds to reach max multiplier
FitStreakMultiplierMax          = 5.0       # maximum streak multiplier (1x base + 4x bonus)
# 038 T001 crash penalty (t14 curriculum-ramped, see specs/038-accurate-m2/t12-retro.md).
# BOTH terms scaled by variationScale [0..1]: early gens forgive (mult≈1, don't flatten the
# fresh population — t13's un-ramped linear-clamp zeroed the majority), late gens enforce.
#   hull (rare→skill-correlated late): factor^(K_hull·scale) — relaxed 0.5→0.75, decisive late
#   OOB (common early→gone late):      exp(−weight·scale·K_oob/294) — smooth, never clamps to 0
HullCrashPenaltyFactor          = 0.75      # t14: relaxed from 0.5; ramped + applied as factor^(K_hull·scale)
OobCrashPenaltyWeight           = 2.0       # t14: ramped exp decay; at full ramp ~13-24% hit at t12 OOB rates

# =============================================================================
# DEMETIC GROUPING (scenario assignment)
# =============================================================================
DemeticGrouping                 = 0
DemeSize                        = 1000
DemeticMigProbability           = 20

# =============================================================================
# 032 PHASE 1 — DERIVED PERCEPTUAL FEATURES
# =============================================================================
# Slots 45..53 of TrackerInputs (beacon_pair_span[6], span_rate, target_tilt_*)
# are derived from the existing 36 beacon NDC slots. See specs/032-tracker-nn-
# enhancements/contracts/ini_schema.md and spec.md Q4. Flat key per
# autoc-tracker.ini convention (no section header).
# Derived features (beacon_pair_span, span_rate, target_tilt_*) substitute
# neutral values when EITHER beacon's CEP at the current tick is >= this
# threshold. Default matches kCepSentinelThreshold from
# include/autoc/eval/camera_projection.h (any beacon visible at the existing
# 030 sentinel boundary is also gated here).
# Lower values gate more aggressively on noisy-but-present detections.
# Per spec Q4 + research.md R2.
CepGateThreshold                = 1.25

# =============================================================================
# 040 AIRFRAME OBSTRUCTION (FR-007/008/009) — chase self-occlusion geometry
# =============================================================================
# Replaces the single-AABB proxy, which modelled a 1" wing as a 0.25 m-thick
# brick AND placed the camera exactly on a box face (every forward ray read as
# blocked). Three primitives now: thin wing slab, pod nose box, prop disc.
#
# Units are INCHES — that is how the airframe was measured. Vertical offsets
# are measured UP from the thrust line (up = -z in body NED per
# docs/COORDINATE_CONVENTIONS.md). Stations are measured AFT from the prop disc.
#
# Measured 2026-07-28: the camera sits IN THE WING LEADING EDGE (station 6),
# mid-thickness — 0.5" above the wing bottom, which is itself 0.75" above the
# thrust line, so the camera centre is 1.25" above thrust.
#
# DISABLED for now: Stage D (T043) moves the mount to the leading edge and
# turns this on. Enabling it against the legacy centreline mount would model
# geometry the aircraft does not have.
AirframeObstructionEnabled      = 0

AirframeCameraStationIn         = 6.0    # camera at the wing leading edge
AirframeWingLeStationIn         = 6.0
AirframeWingChordIn             = 7.0
AirframeWingSpanIn              = 30.0
AirframeWingThicknessIn         = 1.0
AirframeWingBottomAboveThrustIn = 0.75   # wing underside above the thrust line
AirframeCameraAboveWingBottomIn = 0.5    # camera centre above the wing underside
AirframeCameraOutboardIn        = 8.0    # camera outboard of the thrust axis
AirframePropDiameterIn          = 5.5    # Master Airscrew 5.5x4 (photo-confirmed)
AirframePropAttenuation         = 0.18   # ASSUMED blade-over-pupil duty; FR-035
