# autoc-craft-only.ini — 034 Phase 7 craft-variation confirmation experiment
# ===========================================================================
# Isolates craft variations as the SOLE source of scenario-to-scenario
# diversity. All other variation classes (wind, entry-pose, rabbit-speed)
# are disabled; a single path is used. With this setup, two scenarios with
# different scenarioSeed differ ONLY in their drawn airframe — so any
# per-scenario divergence in the evolved controller's mean control output
# is attributable to craft draws.
#
# Confirmation test (per specs/034-energy-objective-cleanup/tasks.md US5):
#   - Regression: per-scenario mean(out_pitch) vs scenario.craftTrimDelta
#                 should show negative slope (NN pushes pitch UP to
#                 compensate for nose-down trim)
#   - Regression: mean(out_throttle) vs scenario.craftThrustScale
#                 should show negative slope (more thrust → less throttle
#                 command). NB: the M1 throttle-pegged attractor may
#                 swallow this signal — watch for it
#   - Magnitude:  mean(|out_roll|) should correlate with |craftRollEffDelta|
#
# Success threshold (soft): at least the trim → pitch-bias regression has
# the physically-expected sign with non-trivial R²; at least one other
# axis also reads the expected direction.
#
# Run:
#   ./build/autoc -i autoc-craft-only.ini > logs/autoc-034-craft-confirm.log 2>&1
# Analysis: see specs/034-energy-objective-cleanup/per_axis_aggressiveness.py
# and the planned Phase 7 control-vs-craft regression script.

# =============================================================================
# EVOLUTION PARAMETERS
# =============================================================================
# Same skeleton as autoc.ini — pop 8000, 800 gens, lexicase, rest unchanged.
# Smaller pop / gen count might be enough since the search space is narrower
# with only craft diversity, but keep it consistent for cross-bake comparison.
PopulationSize                  = 8000
NumberOfGenerations             = 800
CrossoverProbability            = 95
CreationProbability             = 5
TournamentSize                  = 5
SwapMutationProbability         = 15
AddBestToNewPopulation          = 1

# NN-specific
NNMutationSigma                 = 0.2
NNSigmaFloor                    = 0.05
NNCrossoverAlpha                = -1
NNInitMethod                    = xavier

# Selection strategy
SelectionMode                   = lexicase

# =============================================================================
# SIMULATION
# =============================================================================
# SINGLE PATH for isolation. longSequential is a long single path good
# for duration / stability testing — gives the NN enough air time per
# scenario to express its compensation for the airframe draw.
SimNumPathsPerGeneration        = 1
EvalThreads                     = 20
PathGeneratorMethod             = longSequential
RandomPathSeedB                 = 13337

# Fresh time-derived seed per bake (or pin if comparing across runs).
Seed                            = -1

# Worker (crrcsim) configuration
WorkerPortOverride             = 0
WorkerProgram                  = ./scripts/crrcsim.sh

# =============================================================================
# SCENARIO VARIATIONS — ALL OFF EXCEPT CRAFT
# =============================================================================
# Total scenarios = SimNumPathsPerGeneration × WindScenarios = 1 × 36 = 36
# (each "wind scenario" gets its own scenarioSeed, which seeds its own craft
# draw, even though wind itself is disabled). Pick the count for statistical
# reach on the per-scenario regression — 36 is the same denominator the
# autoc.ini production runs use, so cross-bake comparison is apples-to-apples.
WindScenarios                   = 36

EnableEntryVariations           = 0         # OFF — no entry-pose diversity
EnableWindVariations            = 0         # OFF — no wind diversity
EnableRabbitSpeedVariations     = 0         # OFF — constant rabbit speed
EnableCraftVariations           = 1         # ON  — the ONLY scenario-level diversity

# Sigma values below are dormant when the enable flag is off but kept at
# the autoc.ini production values for consistency / easy re-enable.
EntryConeSigma                  = 30
EntryRollSigma                  = 30
EntrySpeedSigma                 = 0.1
WindDirectionSigma              = 45
EntryPositionRadiusSigma        = 0.0
EntryPositionAltSigma           = 0.0

# Variation landscape ramp — leave at 40 (same as autoc.ini) so the
# variation_scale ramps in identically; the only varied quantity is craft.
VariationRampStep               = 40

# =============================================================================
# 034 US4 — CRAFT VARIATIONS
# =============================================================================
# Same σ values as autoc.ini so the airframe distribution matches what
# US5 production bakes would see. See autoc.ini header for units/rationale.
CraftCGSigma                    = 0.02
CraftDragSigma                  = 0.05
CraftTrimSigma                  = 0.02
CraftThrustSigma                = 0.05
CraftPitchEffSigma              = 0.05
CraftRollEffSigma               = 0.05

# =============================================================================
# VARIABLE RABBIT SPEED — DORMANT (Enable flag is OFF above)
# =============================================================================
RabbitSpeedNominal              = 12.0
RabbitSpeedSigma                = 2.0
RabbitSpeedMin                  = 9.0
RabbitSpeedMax                  = 18.0
RabbitSpeedCycleMin             = 3.0
RabbitSpeedCycleMax             = 7.0

# =============================================================================
# STORAGE
# =============================================================================
S3Bucket                        = autoc-storage
; S3Profile                     = minio

# =============================================================================
# EVALUATION MODE
# =============================================================================
EvaluateMode                    = 0
; NNWeightFile                  = nn_weights.dat

# =============================================================================
# FITNESS — same conical-cone scoring as autoc.ini
# =============================================================================
FitDistScaleBehind              = 7.0
FitDistScaleAhead               = 2.0
FitConeAngleDeg                 = 45.0
FitStreakThreshold              = 0.5
FitStreakRampSec                = 5.0
FitStreakMultiplierMax          = 5.0

# =============================================================================
# DEMETIC GROUPING — disabled (US5 confirmation isn't deme-aware)
# =============================================================================
DemeticGrouping                 = 0
DemeSize                        = 1000
DemeticMigProbability           = 20
