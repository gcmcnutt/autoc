# autoc-basic-m1-eval.ini — EVAL counterpart of autoc-basic-m1.ini.
#
# Is to autoc-basic-m1.ini as autoc-eval.ini is to autoc.ini: re-evaluates a
# saved weight file against the SAME single-longSequential / 16-wind scenarios
# the basic-m1 diagnostic trained on, for the eval-vs-training bitwise
# (second-order determinism) check.
#
# Workflow:
#   1. Train:   ./build/autoc -i autoc-basic-m1.ini        (Seed=-1 → unique run)
#   2. Extract: ./build/nnextractor <s3_key> → nn_weights.dat
#   3. Eval:    ./build/autoc -i autoc-basic-m1-eval.ini
#   4. Eval fitness must match the STORED training fitness bit-for-bit.
#
# ONLY the eval-mode knobs differ from autoc-basic-m1.ini (Mode explicit,
# Pop/Gens=1, EvalThreads, Seed pinned, S3Bucket, EvaluateMode, NNWeightFile).
# EVERY scenario / variation / fitness knob below is kept bit-identical to
# autoc-basic-m1.ini — a mismatch breaks the repro.
#
# Seed pinned to the basic-m1 run's Effective master seed. Paste a new master
# seed here to replay a different basic-m1 run.
#
# CURRENTLY PINNED TO (041 smoke, 2026-08-13):
#   Run ID     autoc-9223370250214912141-2026-08-13T16:51:03.666Z
#   master seed 1786639863
#   reached gen 320/400 (ended early — the X server the crrcsim workers use was
#   killed out from under them; the run itself was healthy: 16/16
#   rabbitComplete, best -1045.136851 at gen 320)
#   elite dmp  gen9680.dmp.zst   (filenames encode 10000 - actual_gen)

# =============================================================================
# EVOLUTION PARAMETERS (not used in eval mode, but must be present for parsing)
# =============================================================================
Mode                            = pathgen
PopulationSize                  = 1
NumberOfGenerations             = 1
CrossoverProbability            = 95
CreationProbability             = 5
TournamentSize                  = 5
SwapMutationProbability         = 15
AddBestToNewPopulation          = 1

# NN-specific (not used in eval, but parsed)
NNMutationSigma                 = 0.2
NNSigmaFloor                    = 0.05
NNCrossoverAlpha                = -1
NNInitMethod                    = xavier

# Selection strategy (not used in eval)
SelectionMode                   = lexicase
LexicaseEpsilonMode             = mad

# =============================================================================
# SIMULATION  —  MUST MATCH autoc-basic-m1.ini for bit-exact repro
# =============================================================================
ControlIntervalMsec             = 50       # t10: 20 Hz (must == SIM_TIME_STEP_MSEC)
ServoModelEnabled               = 1         # 037 servo v2 (PWM latch + slew)
SimNumPathsPerGeneration        = 1         # single path (longSequential)
EvalThreads                     = 8

# Path generation: random, classic, line, computedPaths, longSequential,
#                  aeroStandard, progressiveDistance
PathGeneratorMethod             = longSequential

RandomPathSeedB                 = 13337      # path geometry seed — MUST match training

# RNG seed: pinned to the basic-m1 run's Effective master seed for a
# bit-deterministic replay (autoc-basic-m1.ini uses Seed=-1 → unique per run,
# so paste the logged master seed here after each training run).
Seed                            = 1786639863   # 041 smoke, run autoc-9223370250214912141-2026-08-13T16:51:03.666Z

# Worker (crrcsim) configuration
WorkerPortOverride             = 0
WorkerProgram                  = ./scripts/crrcsim.sh

# =============================================================================
# SCENARIO VARIATIONS  —  MUST MATCH autoc-basic-m1.ini (all four classes ON)
# =============================================================================
# 1 longSequential path × 16 winds = 16 evals per individual.
WindScenarios                   = 16

# Variation class enables (1=enabled, 0=disabled)
EnableEntryVariations           = 1         # ON  — entry-pose diversity
EnableWindVariations            = 1         # ON  — wind/gust/thermal diversity
EnableRabbitSpeedVariations     = 1         # ON  — variable rabbit speed
EnableCraftVariations           = 1         # ON  — per-scenario airframe diversity
EnableHullCrashPenalty          = 0         # M1: off (no-op pathgen)

# Gaussian sigma values (degrees; converted to radians in code)
EntryConeSigma                  = 18        # 037 T006: 2.5-sigma clamp -> 45 deg max half-angle
EntryRollSigma                  = 30
EntrySpeedSigma                 = 0.06      # 037 T006: 2.5-sigma clamp -> 15% max speed delta
WindDirectionSigma              = 45

# Entry position sigma in meters (0=disabled for on-point start)
EntryPositionRadiusSigma        = 0.0
EntryPositionAltSigma           = 0.0

# =============================================================================
# CRAFT VARIATIONS — MUST MATCH autoc-basic-m1.ini (EnableCraftVariations=1).
# =============================================================================
CraftCGSigma                    = 0.02
CraftDragSigma                  = 0.05
CraftTrimSigma                  = 0.02
CraftThrustSigma                = 0.05
CraftPitchEffSigma              = 0.05
CraftRollEffSigma               = 0.05
CraftServoSlewSigma             = 4.0       # /s, autoc [-1,1] units
CraftThrustTauSigma             = 0.060

# Variation landscape ramp (0=disabled, >0 = gens per step) — MUST match training
# so the eval'd genome's saved variation_scale lands on the same scenario draws.
VariationRampStep               = 20

# =============================================================================
# VARIABLE RABBIT SPEED — MUST MATCH autoc-basic-m1.ini.
# =============================================================================
RabbitSpeedNominal              = 12.0
RabbitSpeedSigma                = 2.0
RabbitSpeedMin                  = 9.0
RabbitSpeedMax                  = 18.0
RabbitSpeedCycleMin             = 3.0
RabbitSpeedCycleMax             = 7.0

# =============================================================================
# STORAGE
# =============================================================================
S3Bucket                        = autoc-eval
; S3Profile                     = minio

# =============================================================================
# EVALUATION MODE
# =============================================================================
EvaluateMode                    = 1
# Weight file: exported via nnextractor from the basic-m1 training S3 artifact
NNWeightFile                    = nn_weights.dat

# =============================================================================
# FITNESS: POINT-ACCUMULATION SCORING (022 conical surface V4) — MUST MATCH
# =============================================================================
FitDistScaleBehind              = 7.0
FitDistScaleAhead               = 2.0
FitConeAngleDeg                 = 45.0
FitStreakThreshold              = 0.5
FitStreakRampSec                = 5.0

# --- 041 US4: envelope occupancy + specific-force inputs ---------------------
# ⚠️ MUST stay bit-identical to the training ini, like every other scenario /
# variation / fitness knob in this file. These change the NN INPUT VECTOR, so a
# mismatch does not merely shift a number -- it evaluates a different policy
# input and the eval-vs-training bitwise check fails for a CONFIG reason that
# looks exactly like a code regression.
EnableEnvelopeInputs            = 1         # IN_ENVELOPE + ENVELOPE_SECS populated
EnableAccelInputs               = 1         # ACCEL_X/Y/Z populated (body specific force, g)
AccelScaleG                     = 8.0       # must match kAccelScale_g (nn_inputs.h)

FitStreakMultiplierMax          = 5.0
HullCrashPenaltyFactor          = 0.5
OobCrashPenaltyWeight           = 0.0

# =============================================================================
# DEMETIC GROUPING (not used in eval mode)
# =============================================================================
DemeticGrouping                 = 0
DemeSize                        = 1000
DemeticMigProbability           = 20

# =============================================================================
# 040 AIRFRAME OBSTRUCTION (FR-007/008/009) — chase self-occlusion geometry
# =============================================================================
# Replaces the single-AABB proxy, which modelled a 1" wing as a 0.25 m-thick
# brick AND placed the camera exactly on a box face (so every forward ray read
# as blocked). Three primitives now: thin wing slab, pod nose box, prop disc.
# The prop ATTENUATES rather than gates (FR-009).
#
# UNITS: METRES, body frame — like the rest of this file.
# DATUM: the propeller axle / back of the prop is station 0 = (0, 0, 0).
# AXES  (docs/COORDINATE_CONVENTIONS.md): +x forward through the nose,
#        +y out the RIGHT wing, +z DOWN through the belly.
#        Stations run AFT, so they are at NEGATIVE x. "Up" is NEGATIVE z.
#
# Measured 2026-07-28 (sketch + prop photo), converted from inches once:
#   wing   7" chord (LE station 6 -> TE station 13), 30" span, 1" thick,
#          underside 0.75" up from the axle
#   prop   Master Airscrew 5.5x4 two-blade -> r = 0.06985
#   camera IN THE WING LEADING EDGE: station 6 aft, 8" outboard, mid-thickness
#          at 1.25" up  =>  body (-0.152400, +0.203200, -0.031750)
#
# Present in EVERY ini even where the mode ignores them, so the config surface
# stays uniform and a mode switch never trips a missing key.
#
# DISABLED for now: Stage D (T043) moves the camera mount to the leading edge
# and turns this on. Enabling it against the legacy mount would model geometry
# the aircraft does not have.
AirframeObstructionEnabled      = 0

AirframeWingMinX                = -0.330200   # trailing edge
AirframeWingMinY                = -0.381000   # port tip
AirframeWingMinZ                = -0.044450   # wing top (up)
AirframeWingMaxX                = -0.152400   # leading edge
AirframeWingMaxY                = 0.381000    # starboard tip
AirframeWingMaxZ                = -0.019050   # wing underside

AirframeNoseMinX                = -0.152400
AirframeNoseMinY                = -0.038100
AirframeNoseMinZ                = -0.038100
AirframeNoseMaxX                = 0.0
AirframeNoseMaxY                = 0.038100
AirframeNoseMaxZ                = 0.038100

AirframePropPlaneX              = 0.0         # the datum plane
AirframePropAxisY               = 0.0
AirframePropAxisZ               = 0.0
AirframePropRadius              = 0.069850    # 5.5in two-blade
AirframePropAttenuation         = 0.18        # ASSUMED blade-over-pupil duty; FR-035
