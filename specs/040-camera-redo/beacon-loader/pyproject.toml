[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beacon-loader"
version = "0.1.0"
description = "FR-4.3 Python loader for 031-beacon-camera .clip files (Principle V format_version-aware)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["beacon_loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
