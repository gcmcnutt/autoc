[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beacon-viewer"
version = "0.1.0"
description = "FR-4.1 bench-mode live UVC viewer + record-to-clip for 031-beacon-camera"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",      # UVC capture via cv2.VideoCapture (cross-platform)
    "beacon-loader",           # for .clip format schema + Frame entity reuse
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["beacon_viewer"]

[project.scripts]
beacon-viewer = "beacon_viewer.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
beacon-loader = { path = "../beacon-loader", editable = true }
