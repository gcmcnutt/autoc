# autoc-eval.ini — NN evaluation mode
# Evaluates a saved weight file against scenarios.
# Use: ./build/autoc -i autoc-eval.ini
#
# Workflow:
#   1. Train with autoc.ini → weights saved to S3
#   2. Extract: ./build/nnextractor <s3_key> → nn_weights.dat
#   3. Eval:    ./build/autoc -i autoc-eval.ini
#   4. Results uploaded to S3 → view in renderer
#
# Typical eval scenarios:
#   - Repro: same PathGeneratorMethod + Seed as training (verify fitness match)
#   - Novel: different method/seed (test generalization)
#   - Stress: wider sigmas or unfamiliar wind conditions
#
# NOTE: Both training and eval use computeScenarioScores with the conical
# scoring surface (022). Eval fitness should match training fitness exactly
# for the same individual on the same scenarios. The renderer shows the
# STORED training fitness from the .dmp file, not the eval-computed value.

# =============================================================================
# EVOLUTION PARAMETERS (not used in eval mode, but must be present for parsing)
# =============================================================================
PopulationSize                  = 1
NumberOfGenerations             = 1
CrossoverProbability            = 95
CreationProbability             = 5
TournamentSize                  = 5
SwapMutationProbability         = 15
AddBestToNewPopulation          = 1

# NN-specific (not used in eval, but parsed)
NNMutationSigma                 = 0.2
NNSigmaFloor                    = 0.05
NNCrossoverAlpha                = -1
NNInitMethod                    = xavier

# Selection strategy (not used in eval)
SelectionMode                   = lexicase

# =============================================================================
# SIMULATION
# =============================================================================
# SimNumPathsPerGeneration: how many paths to evaluate
#   aeroStandard has 6 paths (0-5): StraightAndLevel, SpiralClimb,
#     HorizontalFigureEight, FortyFiveDegreeAngledLoop, HighPerchSplitS,
#     SeededRandomB (geometry from RandomPathSeedB, NOT from Seed)
#   For single-path eval (progressive, longSequential, line): set to 1
ControlIntervalMsec             = 50       # t10: 20 Hz (must == SIM_TIME_STEP_MSEC; close-in bandwidth + 0.8s history — finding.md)
ServoModelEnabled               = 1         # 037 servo v2 (PWM latch + slew): 50Hz latch w/ 0-20ms phase + slew ~24.2/s (autoc [-1,1] units)
SimNumPathsPerGeneration        = 6
EvalThreads                     = 1

# Path generation methods:
#   aeroStandard       — 5 fixed paths (racetrack, loops, figure-8, etc.)
#   progressiveDistance — single expanding-radius path (novel geometry)
#   longSequential     — long single path (duration/stability test)
#   random             — random waypoints (full generalization test)
#   computedPaths      — computed geometry (spirals, loops)
#   classic            — legacy path set
#   line               — simple straight line
PathGeneratorMethod             = aeroStandard

# Seeded random path generation (for aeroStandard reproducibility)
# Must match training (autoc.ini) for exact repro; use different seed for novel
RandomPathSeedB                 = 13337

# RNG seed: controls wind seeds, entry variations, rabbit speed profiles
# Use training seed for exact repro, -1 for novel scenarios
Seed                            = -1

# Worker (crrcsim) configuration
WorkerPortOverride             = 0
WorkerProgram                  = ./scripts/crrcsim-visual.sh

# =============================================================================
# SCENARIO VARIATIONS
# =============================================================================
# WindScenarios: number of wind seeds per path
# Total evals = SimNumPathsPerGeneration × WindScenarios
# Training typically uses 49; eval can use fewer for quick checks
WindScenarios                   = 1

# Entry and wind variations (1=enabled, 0=disabled)
# Disable for clean baseline; enable to test robustness
EnableEntryVariations           = 1
EnableWindVariations            = 1
EnableRabbitSpeedVariations     = 1
EnableCraftVariations           = 1         # 034 US4 — see [Craft] section below for σ knobs
EnableHullCrashPenalty          = 0         # 038 T001 — score ×factor^(#hull-strike scenarios); M2 crash penalty (off=no-op pathgen)

# Entry attitude sigmas (degrees for heading/roll, fraction for speed)
# Cone: nose direction deviates within a cone (no gimbal lock)
EntryConeSigma                  = 18        # 037 T006: 2.5-sigma clamp -> 45 deg max half-angle (was 30)
EntryRollSigma                  = 30        # roll around body axis
EntrySpeedSigma                 = 0.06      # 037 T006: 2.5-sigma clamp -> 15% max speed delta (was 0.1)
WindDirectionSigma              = 45        # degrees

# Entry position sigma in meters (0=disabled, start at origin like xiao)
EntryPositionRadiusSigma        = 0.0
EntryPositionAltSigma           = 0.0

# 034 US4 craft variations — MUST MATCH training ini for eval-time bit-exact
# reproduction. See autoc.ini for full doc + units.
# EnableCraftVariations is in the enable group above.
CraftCGSigma                    = 0.02
CraftDragSigma                  = 0.05
CraftTrimSigma                  = 0.02
CraftThrustSigma                = 0.05
CraftPitchEffSigma              = 0.05
CraftRollEffSigma               = 0.05
CraftServoSlewSigma             = 4.0       # /s, autoc [-1,1] units (2026-06-12 unit fix: center ~24.2 = 82.5ms span transit, clamp 16-32; sigma doubled with the units)
CraftThrustTauSigma             = 0.060     # 037: thrust lag tau sigma (s; center 0.150)

# 043 US5 — IMU imperfection + pitch-damping axes (contracts/craft-imu-axes.md).
# ⛔ MUST match autoc.ini: these rotate/scale/bias BOTH the INAV rate feedback
# and the policy's observation, so a mismatch evaluates a different craft than
# the one trained. Declared explicitly rather than left to the compiled default
# (Constitution VII) — same "both or neither" rule as ini_pair_consistency.
CraftImuMisalignSigma           = 2.0       # deg, one sigma per axis; 2.5σ = ±5° foam-tape mount
CraftGyroScaleSigma             = 0.02      # fraction; 2.5σ = ±5% gyro cal tolerance
CraftAccelScaleSigma            = 0.02      # fraction; 2.5σ = ±5% accel cal tolerance
CraftAccelBiasSigma             = 0.04      # g; from 041-t7 audit (accel_y ~1.7σ; provisional on acc_1G scale)
CraftCmQSigma                   = 0.32      # Cm_q Gaussian width; center -4.2, clamp [-5.0,-3.6] (2.5σ reaches -5.0)

# Variation landscape ramp (0=disabled, >0 = gens per ramp step)
VariationRampStep               = 0

# =============================================================================
# VARIABLE RABBIT SPEED
# =============================================================================
# Master switch: EnableRabbitSpeedVariations above. When 0, RabbitSpeedSigma
# is forced to 0 regardless of the value below.
RabbitSpeedNominal              = 12.0      # m/s (real cruise with streamer, 50% power)
RabbitSpeedSigma                = 2.0       # m/s (68% within 11-15, real Vmax=17)
RabbitSpeedMin                  = 9.0      # m/s (well above stall ~7)
RabbitSpeedMax                  = 18.0      # m/s (real Vmax ~17, slight downhill margin)
RabbitSpeedCycleMin             = 3.0       # seconds (speed change period, min)
RabbitSpeedCycleMax             = 7.0       # seconds (speed change period, max)

# =============================================================================
# STORAGE
# =============================================================================
S3Bucket                        = autoc-eval
; S3Profile                     = minio

# =============================================================================
# EVALUATION MODE
# =============================================================================
# 0 = normal NN evolution, 1 = evaluate saved weight file
EvaluateMode                    = 1
# M1 (pathgen) policy — 45-input NN01, NOT the 66-input tracker net. Explicit
# rather than relying on the compiled default (Constitution VII).
Mode                            = pathgen
# Weight file: exported via nnextractor from training S3 artifact
NNWeightFile                    = nn_weights.dat

# =============================================================================
# FITNESS: POINT-ACCUMULATION SCORING (022, conical surface V4)
# =============================================================================
# Polar (conical) scoring surface with directional distance and clamped angle.
# See autoc.ini for full design notes. MUST match autoc.ini for eval fitness
# to reproduce training fitness.
FitDistScaleBehind              = 7.0       # distance scale behind rabbit (m: -7m back = 0.5 threshold)
FitDistScaleAhead               = 2.0       # distance scale ahead of rabbit (m, sharp)
FitConeAngleDeg                 = 45.0      # angular half-decay from tail-chase line (deg)
FitStreakThreshold              = 0.5       # min stepPoints to maintain streak
FitStreakRampSec                = 5.0       # seconds to reach max multiplier

# --- 041 US4: envelope occupancy + specific-force inputs ---------------------
# ⚠️ MUST stay bit-identical to the training ini, like every other scenario /
# variation / fitness knob in this file. These change the NN INPUT VECTOR, so a
# mismatch does not merely shift a number -- it evaluates a different policy
# input and the eval-vs-training bitwise check fails for a CONFIG reason that
# looks exactly like a code regression.
EnableAccelInputs               = 1         # ACCEL_X/Y/Z populated (body specific force, g)
AccelScaleG                     = 8.0       # must match kAccelScale_g (nn_inputs.h)

FitStreakMultiplierMax          = 5.0       # maximum streak multiplier (1x base + 4x bonus)

# --- 041 P2-3 — FLIGHT ARENA (ONE arena, both modes, both sides) -------------
# Was M1-implicit: the M1 termination check used a hardcoded 70/7/120 envelope
# while DIST_TO_BOUNDARY described FlightArena's 80/5/100 defaults. Both now
# read these keys, so what the policy is told and what ends the scenario are
# the same cylinder.
# ⛔ The band is ASYMMETRIC about the arm point: +50 m up, -30 m down. The arm
#    point is -SIM_INITIAL_ALTITUDE (35 m AGL), i.e. 30 m above the deck and NOT
#    at mid-band. resolveEngageArena derives the two extents separately from
#    exactly that, which is what makes it an identity on the virtual arena --
#    sim and flight the same arena by construction. arena_tests.cc pins it:
#    move a bound here without moving SIM_INITIAL_ALTITUDE and it fails.
FlightArenaRadius               = 70.0      # m horizontal
FlightArenaFloorAGL             = 25.0      # m AGL hard deck = arm - 30 m
FlightArenaCeilingAGL           = 105.0     # m AGL ceiling = arm + 50 m (band ASYMMETRIC: +50 up, -30 down)

HullCrashPenaltyFactor          = 0.5       # 038 T001 — hull geometric factor^K_hull; gated by EnableHullCrashPenalty (M1: off)
OobCrashPenaltyWeight           = 0.0       # 038 T001 t13 — OOB fraction penalty; 0 = off (M1 keeps score-stop)

# =============================================================================
# DEMETIC GROUPING (not used in eval mode)
# =============================================================================
DemeticGrouping                 = 0
DemeSize                        = 1000
DemeticMigProbability           = 20

# =============================================================================
# 040 AIRFRAME OBSTRUCTION (FR-007/008/009) — chase self-occlusion geometry
# =============================================================================
# Replaces the single-AABB proxy, which modelled a 1" wing as a 0.25 m-thick
# brick AND placed the camera exactly on a box face (so every forward ray read
# as blocked). Three primitives now: thin wing slab, pod nose box, prop disc.
# The prop ATTENUATES rather than gates (FR-009).
#
# UNITS: METRES, body frame — like the rest of this file.
# DATUM: the propeller axle / back of the prop is station 0 = (0, 0, 0).
# AXES  (docs/COORDINATE_CONVENTIONS.md): +x forward through the nose,
#        +y out the RIGHT wing, +z DOWN through the belly.
#        Stations run AFT, so they are at NEGATIVE x. "Up" is NEGATIVE z.
#
# Measured 2026-07-28 (sketch + prop photo), converted from inches once:
#   wing   7" chord (LE station 6 -> TE station 13), 30" span, 1" thick,
#          underside 0.75" up from the axle
#   prop   Master Airscrew 5.5x4 two-blade -> r = 0.06985
#   camera IN THE WING LEADING EDGE: station 6 aft, 8" outboard, mid-thickness
#          at 1.25" up  =>  body (-0.152400, +0.203200, -0.031750)
#
# Present in EVERY ini even where the mode ignores them, so the config surface
# stays uniform and a mode switch never trips a missing key.
#
# DISABLED for now: Stage D (T043) moves the camera mount to the leading edge
# and turns this on. Enabling it against the legacy mount would model geometry
# the aircraft does not have.
AirframeObstructionEnabled      = 0

AirframeWingMinX                = -0.330200   # trailing edge
AirframeWingMinY                = -0.381000   # port tip
AirframeWingMinZ                = -0.044450   # wing top (up)
AirframeWingMaxX                = -0.152400   # leading edge
AirframeWingMaxY                = 0.381000    # starboard tip
AirframeWingMaxZ                = -0.019050   # wing underside

AirframeNoseMinX                = -0.152400
AirframeNoseMinY                = -0.038100
AirframeNoseMinZ                = -0.038100
AirframeNoseMaxX                = 0.0
AirframeNoseMaxY                = 0.038100
AirframeNoseMaxZ                = 0.038100

AirframePropPlaneX              = 0.0         # the datum plane
AirframePropAxisY               = 0.0
AirframePropAxisZ               = 0.0
AirframePropRadius              = 0.069850    # 5.5in two-blade
AirframePropAttenuation         = 0.18        # ASSUMED blade-over-pupil duty; FR-035
