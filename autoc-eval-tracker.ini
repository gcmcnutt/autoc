# autoc-eval-tracker.ini — M2 (tracker) NN re-evaluation mode
# Evaluates a saved tracker-mode weight file against the same source dmp
# + scenario set used during training, for determinism / bitwise regression
# checks on the M2 controller.
# Use: ./build/autoc -i autoc-eval-tracker.ini
#
# Workflow:
#   1. Train with autoc-tracker.ini → weights saved to S3
#   2. Extract: ./build/nnextractor <s3_key> → nn_weights.dat
#   3. Eval:    ./build/autoc -i autoc-eval-tracker.ini
#   4. Results uploaded to S3 → view in renderer
#
# Mode-mapping (2026-05-10):
#   - Mode = tracker below → this file is the M2 eval config
#   - Mirrors autoc-tracker.ini's tracker training settings; the seed below
#     should be pinned to the training run we want to reproduce (placeholder
#     = smoke15-hullon's resolved seed; update when re-evaluating a
#     different run)
#   - M1 eval is autoc-eval.ini; M1 training is autoc.ini
#
# Output files (eval mode prefixes everything with "eval-"):
#   - eval-data.dat / eval-data.stc — local per-tick + per-gen output
#   - eval-mode S3 bucket below (autoc-eval-arm by default) holds the dmp
#     + .gp + .log so the live training bucket (autoc-storage) stays clean
#
# DETERMINISM NOTE: Tracker eval reproduces training when (a) Mode + Seed +
# TrackerSourceRun + scenario subset + all Enable* + sigmas match training,
# AND (b) the NN weight file came from the same training run. The per-
# scenario joint-PRNG state is reseeded from windSeed per scenario, so the
# CrashHull Bernoulli draws stay deterministic across train↔eval (P1 fix
# from 030 M11.preA.3, 2026-05-09).

# =============================================================================
# 030 TRACKER MODE — runtime mode dispatch (FR-019) + source dmp (FR-001)
# =============================================================================
# Mode select. Required for tracker eval; ConfigManager loud-fails if
# tracker mode lacks TrackerSourceRun.
Mode                            = tracker

# Source dmp + bucket — MUST match the training-run TrackerSourceRun/Bucket
# (autoc-tracker.ini).
#
# HISTORY — two prior configurations of this file, kept because each is a
# different job and switching back is a matter of restoring the block:
#   * 040 T021 BIT-IDENTITY GATE (2026-07-28): t9 TRAINING source
#     `autoc-m1 · autoc-9223370253553029228-…/gen9200.dmp.zst`, Seed = 1783621931,
#     SimNumPathsPerGeneration = 6, WindScenarios = 49, t9 gen430 elite in
#     nn_weights-tracker.dat ⇒ must reproduce fitness -13949.366286
#     (research.md §R11). Any other number means the Stage-B per-tick-rule
#     extraction was not behaviour-preserving.
#   * 038 t10 novel source (2026-07-10): `autoc-eval ·
#     autoc-9223370253134917267-2026-07-10T21:44:18.540Z/gen9999.dmp.zst`,
#     master 1783719858 — 7 random paths × 7 winds flown by the same pinned M1
#     elite. Still available (retain=keep) as a second independent novel sample.
#
# 2026-08-06 (040 T085 NOVEL-PATH EVAL): repointed to the freshly-generated
# novel-geometry source — 7 random paths × 7 winds = 49 scenarios flown by the
# PINNED M1 elite (autoc-m1 · autoc-9223370253553029228-…/gen9200.dmp.zst, the
# same M1 every 040 M2 bake trained against), all variation classes on.
# Generated by: ./build/autoc -i autoc-eval.ini  (logs/autoc-040-t5-m1-novel-eval.log,
# master seed 1786035214, 49/49 RabbitComplete). retain=expire.
TrackerSourceRun                = autoc-9223370250819561192-2026-08-06T16:53:34.615Z/gen9999.dmp.zst
TrackerSourceBucket             = autoc-eval

# Scenario subset — empty = all 294 (6 paths × 49 winds). For determinism
# repro, leave empty so the full training scenario set is exercised. For
# quick smoke, restrict to a small subset (e.g., `= 0,1,2`).
TrackerPathSubset               =
TrackerWindSubset               =

# =============================================================================
# EVOLUTION PARAMETERS (not used in eval mode, but must be present for parsing)
# =============================================================================
PopulationSize                  = 1
NumberOfGenerations             = 1
CrossoverProbability            = 95
CreationProbability             = 5
TournamentSize                  = 5
SwapMutationProbability         = 15
AddBestToNewPopulation          = 1

# NN-specific (not used in eval, but parsed)
NNMutationSigma                 = 0.2
NNSigmaFloor                    = 0.05
NNCrossoverAlpha                = -1
NNInitMethod                    = xavier

# Selection strategy (not used in eval)
SelectionMode                   = lexicase
LexicaseEpsilonMode             = mad       # matches autoc-tracker.ini (no-op for single-genome eval, kept for parity)

# =============================================================================
# SIMULATION
# =============================================================================
ControlIntervalMsec             = 50       # t10: 20 Hz (must == SIM_TIME_STEP_MSEC; close-in bandwidth + 0.8s history — finding.md)
ServoModelEnabled               = 1         # 037 servo v2 (PWM latch + slew): 50Hz latch w/ 0-20ms phase + slew ~24.2/s (autoc [-1,1] units)
SimNumPathsPerGeneration        = 7         # 2026-08-06 (040 T085): matches the novel source above (7 random paths).
EvalThreads                     = 8         # eval-style (training uses 20)

# Path generation (unused in tracker mode; preserved for key-surface parity).
PathGeneratorMethod             = aeroStandard
RandomPathSeedB                 = 13337

# RNG seed: pin to the training run's resolved seed for exact-repro eval.
# 2026-07-28 (040 T021): 1783621931 = t9's effective master seed. The seed
# drives per-scenario wind/entry/craft draws, so reproducing t9's fitness
# requires reproducing t9's scenarios — a different seed scores the same
# genome against different conditions and yields a valid but non-comparable
# number. Restore to -1 for the T085 novel-geometry eval.
# (t6 knob-off repro used 1783437625.)
Seed                            = -1

# Worker: CRRCSim FDM-driven, matches autoc-tracker.ini.
WorkerPortOverride             = 0
WorkerProgram                  = ./scripts/crrcsim.sh

# =============================================================================
# SCENARIO VARIATIONS
# =============================================================================
WindScenarios                   = 7         # 2026-08-06 (040 T085): 7 paths × 7 winds = 49 novel scenarios.

EnableEntryVariations           = 1         # active under crrcsim FDM
EnableWindVariations            = 1         # active under crrcsim FDM
EnableRabbitSpeedVariations     = 0         # tracker has no synthetic rabbit
EnableCraftVariations           = 1         # 034 US4 — see [Craft] section below for σ knobs
EnableHullCrashPenalty          = 1         # 038 T001 — score ×factor^(#hull-strike scenarios); M2 crash penalty (off=no-op pathgen)
EnablePredictorHead             = 1         # 038 US3 — MUST match autoc-tracker.ini (prediction_score lexicase axis) for bitwise eval repro
TrackerChaseUseSourceScenarioSeed = 1       # 038 t7 — MUST match the run being eval'd; 1 = t7 shared-env (0 was the t6 knob-off repro)

EntryConeSigma                  = 18        # 037 T006: 2.5-sigma clamp -> 45 deg max half-angle (was 30)
EntryRollSigma                  = 30        # roll around body axis
EntrySpeedSigma                 = 0.06      # 037 T006: 2.5-sigma clamp -> 15% max speed delta (was 0.1)
WindDirectionSigma              = 45

EntryPositionRadiusSigma        = 0.0
EntryPositionAltSigma           = 0.0

# 034 US4 craft variations — MUST MATCH autoc-tracker.ini for eval-time
# bit-exact reproduction. See autoc.ini for full doc + units.
# EnableCraftVariations is in the enable group above.
CraftCGSigma                    = 0.02
CraftDragSigma                  = 0.05
CraftTrimSigma                  = 0.02
CraftThrustSigma                = 0.05
CraftPitchEffSigma              = 0.05
CraftRollEffSigma               = 0.05
CraftServoSlewSigma             = 4.0       # /s, autoc [-1,1] units (2026-06-12 unit fix: center ~24.2 = 82.5ms span transit, clamp 16-32; sigma doubled with the units)
CraftThrustTauSigma             = 0.060     # 037: thrust lag tau sigma (s; center 0.150)

# Variation ramp — must match training so the variation scale evolution
# reaches the same per-scenario perturbation magnitudes by the eval point.
# 038 t8: 0 = ramp off (scale pinned 1.0) — matches autoc-tracker.ini t8.
VariationRampStep               = 0
# --- 040 US6: CAMERA VARIATION -----------------------------------------------
# Each scenario draws its own camera imperfections, so the controller cannot
# depend on a perfectly known camera. Hard clips (20 deg alignment, 5 mm
# translation) are CONTRACT and live in camera_variation.h, not here.
#
# ROLL is the highest-impact term. Under the angular representation a boresight
# error is a near-constant additive offset -- clean, learnable as a subtraction.
# Roll rotates the image plane, so it biases the port->starboard TILT cue
# degree-for-degree, and tilt drives the roll command.
#
# NOT RAMPED, per scenario_meta_apply.h: camera is the same category as craft --
# sensor/airframe DIVERSITY, not difficulty -- so it sits at full magnitude from
# gen 0 and applyVariationScale leaves it alone.
#
# TRANSLATION feeds the OBSTRUCTION path only: +/-5 mm is 0.03 deg at 10 m
# (nothing for bearing) but swings propeller clearance ~15%.
EnableCameraVariations          = 1
# Sigmas express the ENVELOPE via the pipeline-wide 2.5-sigma truncation, the
# same convention as EntryConeSigma (18.0 -> 2.5sigma = 45 deg). There is no
# separate clip constant to disagree with.
# 2026-08-03 (t3): 8.0 -> 0.8, i.e. 2.5sigma 20 deg -> 2 deg. The t2 bake at
# 20 deg CAPPED HARD: worst blind streak pinned at 44.4 s from gen 175 to 369
# (t1 finished at 6.0 s), avgVis 0.624 vs 0.789, and every metric plateaued by
# gen ~250 while t1 was still climbing at 585. 887 blind ticks against a ~894
# tick longest scenario means the chase spends whole scenarios never acquiring.
#
# 2 deg is a DIAGNOSTIC, not a retreat: it keeps the per-scenario random draw and
# genuinely different cameras, so the whole variation path stays exercised. If a
# 2 deg run also caps, we broke plumbing. If it trains normally, then 20 deg was
# simply too hard FOR THIS NN AND FEEDBACK LOOP -- which is an architecture
# finding (no search behaviour; recovery is "point where I last saw it", and a
# miscalibrated boresight points that reflex systematically wrong) rather than a
# tuning problem.
#
# NOTE the M classification on these is doubtful: +/-20 deg is a visibly crooked
# mount, not a measured build tolerance. Re-derive before trusting it again.
CameraBoresightSigmaDeg         = 4.0        # M  yaw+pitch; 2.5sigma = 10 deg
CameraRollSigmaDeg              = 4.0        # M  2.5sigma = 10 deg
# PER-AXIS: the camera is bonded to the wing LEADING-EDGE FACE, so build
# tolerance is not isotropic -- spanwise is loosest, vertical tightest.
CameraMountTranslationSigmaX    = 0.0020     # M  2.5sigma = +/-5 mm  (into/out of the face)
CameraMountTranslationSigmaY    = 0.0040     # M  2.5sigma = +/-10 mm (spanwise)
CameraMountTranslationSigmaZ    = 0.0012     # M  2.5sigma = +/-3 mm  (vertical)
CameraWingThicknessSigmaM       = 0.0008     # A  folded foam board is variable
# DEFERRED (operator 2026-08-02) -- the emitter stays PERFECT for this pass. The
# draw is plumbed and recorded so it is verifiable, but held at zero sigma until
# the lens+filter field tests pin SignalAmbientKnee. Holding it also keeps
# t2 - t1 attributable to CAMERA variation alone.
CameraAmbientSigmaFrac          = 0.0        # A  deferred, not dropped


# =============================================================================
# VARIABLE RABBIT SPEED (unused in tracker mode; preserved for parity)
# =============================================================================
RabbitSpeedNominal              = 12.0
RabbitSpeedSigma                = 2.0
RabbitSpeedMin                  = 9.0
RabbitSpeedMax                  = 18.0
RabbitSpeedCycleMin             = 3.0
RabbitSpeedCycleMax             = 7.0

# =============================================================================
# 030 TRACKER FITNESS — trail rabbit (matches autoc-tracker.ini)
# =============================================================================
TrailDistance                   = 3.048      # m (10 ft per FR-008)
LowSpeedTrailThreshold          = 2.0        # m/s
LowSpeedTrailHysteresis         = 0.5        # m/s ±band

# =============================================================================
# 030 TRACKER FITNESS — crash hull (must match training for bitwise repro)
# =============================================================================
CrashHullShape                  = SPHERE
CrashHullRadius                 = 1.0        # m
CrashHullProbability            = 0.10       # matches autoc-tracker.ini

# =============================================================================
# 030 TRACKER ARENA (matches autoc-tracker.ini)
# =============================================================================
FlightArenaRadius               = 80.0
FlightArenaFloorAGL             = 5.0
FlightArenaCeilingAGL           = 100.0

# =============================================================================
# 030 CAMERA (matches autoc-tracker.ini)
# =============================================================================
CameraCount                     = 1
# 040 T029 (FR-003) — the sensor GRID is the only resolution input; the field
# of view is DERIVED as pixels x deg/px, so field and resolution cannot
# disagree. CameraFOVHorizontalDeg / CameraFOVVerticalDeg are retired.
# 320 x 200 @ 0.304 deg/px  =>  97.3 deg H x 60.8 deg V.
# 041 T041a (FR-029): V was 240 px, a 4:3 invention. 320:200 = 1.6 matches the
# real sensor's aspect (OV9281 is 1280x800), so the sim grid is a clean 4x
# downsample of the actual flight sensor.
# SQUARE PIXELS BY CONSTRUCTION: the sim has ONE angular pitch scalar used for
# both axes, so 320 x 200 at 0.304 deg/px is square by definition -- matching
# 1280 x 800 / 4 on the real sensor. Aspect 1.6 both.
#
# 041 T041d (FR-029) — CameraDegPerPixel 0.375 -> 0.304, FROM MEASUREMENT.
# The T041a note reserved exactly one trigger for touching this knob: "revisit
# from MEASUREMENT (the real grid image, an 031 deliverable when hardware
# lands), not from a second estimate." That trigger fired 2026-08-16.
#   031 calibrated the flight optic -- the $3 1.8 mm M12 fisheye on the OV9281,
#   ruled mat at h = 15 in, frame archived as
#   specs/031-beacon-camera/fisheye-1p8mm-grid-15in.jpg:
#     PROJECTION = equidistant (f-theta), confirmed center-to-edge. The sim has
#       been analytic equidistant since 038 t9, so nothing moves -- the
#       measurement VALIDATES a model already three features old.
#     NATIVE PITCH = 0.076 deg/px, uniform (the equidistant silver lining).
#     FOV = 95 H x 61 V, direct tape measurement at the frame edge.
#   The sim grid is that sensor binned 4x, so the sim pitch is 4 x 0.076 =
#   0.304, and 320 x 200 at that pitch is 97.3 x 60.8 -- the measured lens
#   inside its own spread (tape 95x61, f-theta extrapolation 98x61). Grid AND
#   pitch now both trace to hardware; neither is an assumption any more.
# The retired estimate: ~124 x 78 deg equidistant, conservatively split to
# 120 x 75. It was wrong in the direction nobody guarded against -- the real
# field is NARROWER, ~19% on both axes. The single-fisheye-at-120 assumption
# is RETIRED for this lens; 120 deg H needs the birded pair (2 x 95 at ~+/-30
# splay ~= 125-130 combined) or a wider lens. See
# specs/031-beacon-camera/camera-era-knobs.md section 6.
# Per-pixel CEP and quantisation get ~19% FINER as a consequence. That is not
# a side effect to apologise for: the real lens resolves better than we
# assumed. The FIELD narrowing is the fitness-affecting half.
# ⚠️ FITNESS-AFFECTING (narrower field => more/longer blind excursions), so this
# lands in the A1 bundle only, never mid-comparison.
CameraPixelsH                   = 320
CameraPixelsV                   = 200
CameraDegPerPixel               = 0.304
# 040 T017 — CameraFrameRateHz / CameraLatencyMs retired (see autoc-tracker.ini)
CameraMountOffsetX              = -0.150400   # 040 T043 baseline mount: wing LE, 2 mm proud of the LE face
CameraMountOffsetY              = 0.203200    # 8" outboard of the thrust axis -- clears the prop disc
CameraMountOffsetZ              = -0.031750   # ~1.25" above the axle (NED, +Z down => -Z is up)

# =============================================================================
# 030 BEACONS (matches autoc-tracker.ini)
# =============================================================================
BeaconLeftWavelengthNm          = 850
BeaconRightWavelengthNm         = 940
# 040 T030 (FR-004) — MEASURED separation 0.772 m between emitter centres
# (30in span + ~5 mm enclosure offset per tip), replacing 0.9 m. Beacon
# separation is the ONLY range channel the controller has, so the old value
# put a systematic ~17% into every inferred range.
BeaconLeftMountX                = 0.0
BeaconLeftMountY                = -0.386     # left wingtip (body -y)
BeaconLeftMountZ                = 0.0
BeaconRightMountX               = 0.0
BeaconRightMountY               = +0.386     # right wingtip (body +y)
BeaconRightMountZ               = 0.0

# CEP gate (matches autoc-tracker.ini). Perception visibility threshold — gates
# beacon-visible ticks → NN inputs → fitness, so eval MUST set it explicitly to
# match training (not rely on a default — the 032 cepGateThreshold footgun).
CepGateThreshold                = 1.25


# =============================================================================
# STORAGE
# =============================================================================
# 035 T022 — per-mode bucket cutover: eval artifacts land in autoc-eval.
# NOTE: source_dmp_loader reads TrackerSourceRun from THIS bucket — keep it in
# sync with the training run's source (repoint to the fresh energy-objective M1
# source present in autoc-eval before evaluating).
S3Bucket                        = autoc-eval
; S3Profile                     = minio

# =============================================================================
# EVALUATION MODE
# =============================================================================
# 0 = normal NN evolution, 1 = evaluate saved weight file
EvaluateMode                    = 1
# Distinct filename from autoc-eval.ini's nn_weights.dat (M1) so both
# M1 + M2 weight files can coexist on disk for side-by-side validation.
NNWeightFile                    = nn_weights-tracker.dat

# =============================================================================
# FITNESS: POINT-ACCUMULATION SCORING (matches autoc-tracker.ini)
# =============================================================================
FitDistScaleBehind              = 7.0
FitDistScaleAhead               = 2.0
FitConeAngleDeg                 = 45.0
FitStreakThreshold              = 0.5       # 038 P0-F: reverted t15's 0.3 (must match autoc-tracker.ini)
FitStreakRampSec                = 5.0

# --- 041 US4: envelope occupancy + specific-force inputs ---------------------
# ⚠️ MUST stay bit-identical to the training ini, like every other scenario /
# variation / fitness knob in this file. These change the NN INPUT VECTOR, so a
# mismatch does not merely shift a number -- it evaluates a different policy
# input and the eval-vs-training bitwise check fails for a CONFIG reason that
# looks exactly like a code regression.
EnableEnvelopeInputs            = 1         # IN_ENVELOPE + ENVELOPE_SECS populated
EnableAccelInputs               = 1         # ACCEL_X/Y/Z populated (body specific force, g)
AccelScaleG                     = 8.0       # must match kAccelScale_g (nn_inputs.h)
# M2-only: direct-perception envelope estimator (FR-018b). Same must-match rule.
EnvelopeSpanLo                  = 0.02      # far edge  -- rad
EnvelopeSpanHi                  = 0.35      # near edge -- rad
EnvelopeCentroidRadius          = 0.5       # max pair-centroid offset from boresight, rad

FitStreakMultiplierMax          = 5.0
# 038 T001 t14 crash penalty — MUST match autoc-tracker.ini for bitwise eval.
# Curriculum-ramped (variationScale); eval reuses stored variation_scale → reproducible.
HullCrashPenaltyFactor          = 0.75      # t14: hull factor^(K_hull·scale), ramped
OobCrashPenaltyWeight           = 2.0       # t14: OOB exp(−weight·scale·K_oob/N), smooth, never clamps

# =============================================================================
# DEMETIC GROUPING (not used in eval mode)
# =============================================================================
DemeticGrouping                 = 0
DemeSize                        = 1000
DemeticMigProbability           = 20

# =============================================================================
# 040 AIRFRAME OBSTRUCTION (FR-007/008/009) — chase self-occlusion geometry
# =============================================================================
# Replaces the single-AABB proxy, which modelled a 1" wing as a 0.25 m-thick
# brick AND placed the camera exactly on a box face (so every forward ray read
# as blocked). Three primitives now: thin wing slab, pod nose box, prop disc.
# The prop ATTENUATES rather than gates (FR-009).
#
# UNITS: METRES, body frame — like the rest of this file.
# DATUM: the propeller axle / back of the prop is station 0 = (0, 0, 0).
# AXES  (docs/COORDINATE_CONVENTIONS.md): +x forward through the nose,
#        +y out the RIGHT wing, +z DOWN through the belly.
#        Stations run AFT, so they are at NEGATIVE x. "Up" is NEGATIVE z.
#
# Measured 2026-07-28 (sketch + prop photo), converted from inches once:
#   wing   7" chord (LE station 6 -> TE station 13), 30" span, 1" thick,
#          underside 0.75" up from the axle
#   prop   Master Airscrew 5.5x4 two-blade -> r = 0.06985
#   camera IN THE WING LEADING EDGE: station 6 aft, 8" outboard, mid-thickness
#          at 1.25" up  =>  body (-0.152400, +0.203200, -0.031750)
#
# Present in EVERY ini even where the mode ignores them, so the config surface
# stays uniform and a mode switch never trips a missing key.
#
# DISABLED for now: Stage D (T043) moves the camera mount to the leading edge
# and turns this on. Enabling it against the legacy mount would model geometry
# the aircraft does not have.

# --- 040 US4: SIGNAL BUDGET + ACQUISITION (FR-014..FR-020a) -------------------
#
# received = flux x emission(aspect) x 1/r^2 x obstruction x optics
# snr_chip = received / (ambient + noise);  minus cdma_penalty when the two
# beacons share one detector element.
#
# Classification per FR-035: M = measured, D = derived, A = assumed.
# EVERY value is exposed rather than baked, because FR-036's calibration
# rehearsal requires substituting an alternative for each ASSUMED value and
# confirming no structural change is needed. A baked value cannot be rehearsed.
#
# CALIBRATION TARGET OF RECORD: SignalAmbientFloor + SignalNoiseFloor is
# BACK-SOLVED, not measured -- their SUM is set so 0 dB SNR lands exactly at
# CameraDetectionRangeM on beam peak (flux / range^2 = 0.27 / 100^2 = 2.7e-5).
# The measured 031 decode floor (<=10 nA) taken literally would end detection at
# ~5 m and leave every longer range equally at the floor -- monotonic and
# useless. FR-033a asserts the envelope instead and lets the budget shape
# quality WITHIN it. Changing one of these two without the other silently moves
# the envelope edge; a test pins the relationship.
SignalFluxConstant              = 0.27       # M/D uA*m^2 PER EMITTER (031 bench 1.35 five-co-aimed / 5 faces)
SignalOpticsGain                = 1.0        # A   no collection optics fitted
SignalAmbientFloor              = 2.16e-5    # A   uA, varied per scenario in US6
SignalNoiseFloor                = 0.54e-5    # A   uA, fixed sensor term
# AMBIENT COMPRESSION -- 031 field test #4 (2026-08-02). Ambient does TWO things
# to the PD: it forward-biases the junction so beacon current is SHUNTED at the
# sensor (this knee), and it adds shot noise (the floor above). Modelling only
# the noise made more emitter current always buy SNR -- i.e. claiming you can
# out-power the sun. The bench: at ~6x current, a SHADED PD locks at ~20 ft and
# a SUN-EXPOSED one fails at any distance; shadow alone flips it. The 850 nm
# bandpass RAISES this knee, which is why 031 calls the filter a gate rather
# than an optimization. Default sits 100x above the shade ambient, so the
# nominal case is essentially uncompressed (-0.09 dB) and t1 semantics hold.
SignalAmbientKnee               = 2.16e-3    # A   uA -- lens+filter field tests should pin this
SignalCdmaPenaltyDb             = 3.0        # M   031 s4, about one SNR tier
SignalQFloorDb                  = 0.0        # M   031 decode floor -> q = 0
SignalQSaturationDb             = 20.0       # A   where the AGC-normalised q tops out at 9

# Emission pattern (FR-019) -- flat-top with shoulders, NOT a cosine power law.
# Lumileds DS190 beam width. A cos^m law fitted to the same half-power angle
# under-reads the flat region ~16% and over-reads the skirt.
BeaconEmissionFlatDeg           = 45.0       # M   gain == 1 inside this
BeaconEmissionHalfPowerDeg      = 75.0       # M   gain == 0.5 here, 0 at 105 deg

# TWO ENVELOPES, NOT ONE (FR-033). Detection and range-inference have different
# reach and neither may be reported as usable outside its own.
CameraDetectionRangeM           = 100.0      # A   ASSERTED (FR-033a), not emergent
SeparationMinResolvablePx       = 5.0        # A   0.772 m at 0.304 deg/px = 5 px at ~29.1 m
SharedElementPx                 = 1.5        # M   at/under this the blobs merge into one element

# Acquisition timings -- SHIPPED GATEWARE, hardware-measured at N=31 via the
# decoder recovery counter (research R12). We mirror the FSM, we do not invent
# one. N=63 would read 315/629 ms: a VALUE change, which is why these are keys.
#
# THE ONE THAT MATTERS: AcquisitionCoastWindowMs. It is WALLCLOCK-driven
# (oscillator stability), not code-length driven, and the documented M2
# worst-case blind window (~8 s) sits INSIDE it -- so most M2 reacquisitions are
# WARM (154 ms), not cold (308 ms). Sim difficulty hinges on this far more than
# on code length; it is the knob to vary if reacquisition cost turns out to
# matter.
AcquisitionCodeWordMs           = 154.0      # M   one N=31 word -- the WARM relock budget
AcquisitionColdMs               = 308.0      # M   rate stale, needs MINLOCK
AcquisitionHoldMaxMs            = 308.0      # M   HOLDMAX = 2 bad periods
AcquisitionCoastWindowMs        = 10000.0    # M   COASTMAX = 65

# Quality regimes (contracts/perception-interface.md s1): small = confident,
# large = tentative-but-usable, sentinel = not visible.
QualityConfidentCep             = 0.02       # D   cep at q = 9
QualityTentativeCep             = 1.0        # D   cep at q = 0
QualityIdentityUncertainCep     = 0.75       # A   FR-017d floor -- tilt SIGN rides on identity,
                                             #     and tilt drives the roll command

AirframeObstructionEnabled      = 1

AirframeWingMinX                = -0.330200   # trailing edge
AirframeWingMinY                = -0.381000   # port tip
AirframeWingMinZ                = -0.044450   # wing top (up)
AirframeWingMaxX                = -0.152400   # leading edge
AirframeWingMaxY                = 0.381000    # starboard tip
AirframeWingMaxZ                = -0.019050   # wing underside

AirframeNoseMinX                = -0.152400
AirframeNoseMinY                = -0.038100
AirframeNoseMinZ                = -0.038100
AirframeNoseMaxX                = 0.0
AirframeNoseMaxY                = 0.038100
AirframeNoseMaxZ                = 0.038100

AirframePropPlaneX              = 0.0         # the datum plane
AirframePropAxisY               = 0.0
