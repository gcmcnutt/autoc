# autoc-eval-tracker.ini — M2 (tracker) NN re-evaluation mode
# Evaluates a saved tracker-mode weight file against the same source dmp
# + scenario set used during training, for determinism / bitwise regression
# checks on the M2 controller.
# Use: ./build/autoc -i autoc-eval-tracker.ini
#
# Workflow:
#   1. Train with autoc-tracker.ini → weights saved to S3
#   2. Extract: ./build/nnextractor <s3_key> → nn_weights.dat
#   3. Eval:    ./build/autoc -i autoc-eval-tracker.ini
#   4. Results uploaded to S3 → view in renderer
#
# Mode-mapping (2026-05-10):
#   - Mode = tracker below → this file is the M2 eval config
#   - Mirrors autoc-tracker.ini's tracker training settings; the seed below
#     should be pinned to the training run we want to reproduce (placeholder
#     = smoke15-hullon's resolved seed; update when re-evaluating a
#     different run)
#   - M1 eval is autoc-eval.ini; M1 training is autoc.ini
#
# Output files (eval mode prefixes everything with "eval-"):
#   - eval-data.dat / eval-data.stc — local per-tick + per-gen output
#   - eval-mode S3 bucket below (autoc-eval-arm by default) holds the dmp
#     + .gp + .log so the live training bucket (autoc-storage) stays clean
#
# DETERMINISM NOTE: Tracker eval reproduces training when (a) Mode + Seed +
# TrackerSourceRun + scenario subset + all Enable* + sigmas match training,
# AND (b) the NN weight file came from the same training run. The per-
# scenario joint-PRNG state is reseeded from windSeed per scenario, so the
# CrashHull Bernoulli draws stay deterministic across train↔eval (P1 fix
# from 030 M11.preA.3, 2026-05-09).

# =============================================================================
# 030 TRACKER MODE — runtime mode dispatch (FR-019) + source dmp (FR-001)
# =============================================================================
# Mode select. Required for tracker eval; ConfigManager loud-fails if
# tracker mode lacks TrackerSourceRun.
Mode                            = tracker

# Source dmp + bucket — MUST match the training-run TrackerSourceRun/Bucket
# (autoc-tracker.ini). 2026-06-08: repointed to the t6 M1 energy run (gen 800) in autoc-m1.
TrackerSourceRun                = autoc-9223370256079660488-2026-06-06T19:45:15.319Z/gen9200.dmp.zst
TrackerSourceBucket             = autoc-m1

# Scenario subset — empty = all 294 (6 paths × 49 winds). For determinism
# repro, leave empty so the full training scenario set is exercised. For
# quick smoke, restrict to a small subset (e.g., `= 0,1,2`).
TrackerPathSubset               =
TrackerWindSubset               =

# =============================================================================
# EVOLUTION PARAMETERS (not used in eval mode, but must be present for parsing)
# =============================================================================
PopulationSize                  = 1
NumberOfGenerations             = 1
CrossoverProbability            = 95
CreationProbability             = 5
TournamentSize                  = 5
SwapMutationProbability         = 15
AddBestToNewPopulation          = 1

# NN-specific (not used in eval, but parsed)
NNMutationSigma                 = 0.2
NNSigmaFloor                    = 0.05
NNCrossoverAlpha                = -1
NNInitMethod                    = xavier

# Selection strategy (not used in eval)
SelectionMode                   = lexicase

# =============================================================================
# SIMULATION
# =============================================================================
ControlIntervalMsec             = 100       # 037 T001 - NN/sensor cadence (ms); must == SIM_TIME_STEP_MSEC
SimNumPathsPerGeneration        = 6         # matches autoc-tracker.ini
EvalThreads                     = 8         # eval-style (training uses 20)

# Path generation (unused in tracker mode; preserved for key-surface parity).
PathGeneratorMethod             = aeroStandard
RandomPathSeedB                 = 13337

# RNG seed: pin to the training run's resolved seed for exact-repro eval.
# Default = smoke15-hullon's seed (2026-05-10). Update per training run.
# Use -1 for novel scenarios (will not bitwise-match training).
Seed                            = -1

# Worker: CRRCSim FDM-driven, matches autoc-tracker.ini.
WorkerPortOverride             = 0
WorkerProgram                  = ./scripts/crrcsim.sh

# =============================================================================
# SCENARIO VARIATIONS
# =============================================================================
WindScenarios                   = 6         # matches autoc-tracker.ini

EnableEntryVariations           = 1         # active under crrcsim FDM
EnableWindVariations            = 1         # active under crrcsim FDM
EnableRabbitSpeedVariations     = 0         # tracker has no synthetic rabbit
EnableCraftVariations           = 1         # 034 US4 — see [Craft] section below for σ knobs

EntryConeSigma                  = 18        # 037 T006: 2.5-sigma clamp -> 45 deg max half-angle (was 30)
EntryRollSigma                  = 30        # roll around body axis
EntrySpeedSigma                 = 0.06      # 037 T006: 2.5-sigma clamp -> 15% max speed delta (was 0.1)
WindDirectionSigma              = 45

EntryPositionRadiusSigma        = 0.0
EntryPositionAltSigma           = 0.0

# 034 US4 craft variations — MUST MATCH autoc-tracker.ini for eval-time
# bit-exact reproduction. See autoc.ini for full doc + units.
# EnableCraftVariations is in the enable group above.
CraftCGSigma                    = 0.02
CraftDragSigma                  = 0.05
CraftTrimSigma                  = 0.02
CraftThrustSigma                = 0.05
CraftPitchEffSigma              = 0.05
CraftRollEffSigma               = 0.05
CraftServoTauSigma              = 0.010     # 037: servo lag tau sigma (s; center 0.020)
CraftServoSlewSigma             = 2.0       # 037: servo slew sigma (full-throw/s; center 6.0)
CraftThrustTauSigma             = 0.060     # 037: thrust lag tau sigma (s; center 0.150)

# Variation ramp — must match training so the variation scale evolution
# reaches the same per-scenario perturbation magnitudes by the eval point.
VariationRampStep               = 40

# =============================================================================
# VARIABLE RABBIT SPEED (unused in tracker mode; preserved for parity)
# =============================================================================
RabbitSpeedNominal              = 12.0
RabbitSpeedSigma                = 2.0
RabbitSpeedMin                  = 9.0
RabbitSpeedMax                  = 18.0
RabbitSpeedCycleMin             = 3.0
RabbitSpeedCycleMax             = 7.0

# =============================================================================
# 030 TRACKER FITNESS — trail rabbit (matches autoc-tracker.ini)
# =============================================================================
TrailDistance                   = 3.048      # m (10 ft per FR-008)
LowSpeedTrailThreshold          = 2.0        # m/s
LowSpeedTrailHysteresis         = 0.5        # m/s ±band

# =============================================================================
# 030 TRACKER FITNESS — crash hull (must match training for bitwise repro)
# =============================================================================
CrashHullShape                  = SPHERE
CrashHullRadius                 = 1.0        # m
CrashHullProbability            = 0.10       # matches autoc-tracker.ini

# =============================================================================
# 030 TRACKER ARENA (matches autoc-tracker.ini)
# =============================================================================
FlightArenaRadius               = 80.0
FlightArenaFloorAGL             = 5.0
FlightArenaCeilingAGL           = 100.0

# =============================================================================
# 030 CAMERA (matches autoc-tracker.ini)
# =============================================================================
CameraCount                     = 1
CameraFOVHorizontalDeg          = 120.0
CameraFOVVerticalDeg            = 90.0
CameraFrameRateHz               = 30.0
CameraLatencyMs                 = 0.0
CameraMountOffsetX              = 0.0
CameraMountOffsetY              = 0.0
CameraMountOffsetZ              = -0.05

# =============================================================================
# 030 BEACONS (matches autoc-tracker.ini)
# =============================================================================
BeaconLeftWavelengthNm          = 850
BeaconRightWavelengthNm         = 940
BeaconEmissionConeDeg           = 270.0
BeaconLeftMountX                = 0.0
BeaconLeftMountY                = -0.45
BeaconLeftMountZ                = 0.0
BeaconRightMountX               = 0.0
BeaconRightMountY               = +0.45
BeaconRightMountZ               = 0.0

# =============================================================================
# STORAGE
# =============================================================================
# 035 T022 — per-mode bucket cutover: eval artifacts land in autoc-eval.
# NOTE: source_dmp_loader reads TrackerSourceRun from THIS bucket — keep it in
# sync with the training run's source (repoint to the fresh energy-objective M1
# source present in autoc-eval before evaluating).
S3Bucket                        = autoc-eval
; S3Profile                     = minio

# =============================================================================
# EVALUATION MODE
# =============================================================================
# 0 = normal NN evolution, 1 = evaluate saved weight file
EvaluateMode                    = 1
# Distinct filename from autoc-eval.ini's nn_weights.dat (M1) so both
# M1 + M2 weight files can coexist on disk for side-by-side validation.
NNWeightFile                    = nn_weights-tracker.dat

# =============================================================================
# FITNESS: POINT-ACCUMULATION SCORING (matches autoc-tracker.ini)
# =============================================================================
FitDistScaleBehind              = 7.0
FitDistScaleAhead               = 2.0
FitConeAngleDeg                 = 45.0
FitStreakThreshold              = 0.5
FitStreakRampSec                = 5.0
FitStreakMultiplierMax          = 5.0

# =============================================================================
# DEMETIC GROUPING (not used in eval mode)
# =============================================================================
DemeticGrouping                 = 0
DemeSize                        = 1000
DemeticMigProbability           = 20
